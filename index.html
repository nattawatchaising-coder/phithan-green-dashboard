<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); background: var(--bg); color: var(--text-1); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
#root { height: 100dvh; }
/* ปุ่มที่ไม่ประกาศ border ไม่ได้แปลว่า "ไม่มีขอบ" — มันตกไปใช้ขอบนูชสามมิติของเบราว์เซอร์
   (2px outset สีดำ) รีเซ็ตที่นี่ทีเดียว น้ำหนักระดับอิลิเมนต์ ขอบที่ตั้งใจใส่ไว้จึงยังชนะตามเดิม */
button, input, textarea, select { font-family: inherit; border: none; }
/* ช่องกรอกที่ไม่มีใครกำหนดพื้นให้ ตกไปใช้พื้นจางของชุดสี ไม่ใช่ขาวล้วน
   ช่องกรอกคือหลุมที่รอให้พิมพ์ลงไป ถ้าขาวเท่าแผ่นที่รองอยู่ก็หายไปทั้งช่อง
   กฎนี้อยู่ระดับอิลิเมนต์ ช่องที่กำหนดพื้นเองไว้ในคลาสหรือใน style ยังชนะตามเดิม */
input, textarea, select { background: var(--surface2); color: var(--text-1); }
/* ช่องกรอกเป็นหลุมที่จมลงไป — วงแหวนด้านในคือตัวบอกขอบ ไม่ใช่พื้น
   พื้นช่องต่างจากพื้นการ์ดแค่ 10/255 ลำพังพื้นจึงกลืนไปกับแผ่นที่รองอยู่
   เขียนเป็น box-shadow ไม่ใช่ border เพราะไม่กินที่เพิ่ม ไม่ขยับ layout
   และเบราว์เซอร์รีเซ็ต border ทับไม่ได้ ซึ่งเป็นบั๊กที่เพิ่งเจอมาสองรอบ
   ⚠ ไม่ครอบ checkbox/radio/range/color/file — พวกนั้นเบราว์เซอร์วาดเอง วงแหวนจะเลอะ */
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),
textarea, select { box-shadow: var(--shadow-inset); }
input:focus, textarea:focus, select:focus { outline: none; }
/* ⚠ กฎโฟกัสต้องลาก :not() ชุดเดียวกันมาด้วย ไม่ใช่เขียน input:focus-visible สั้น ๆ
   กฎด้านบนมี :not() ห้าตัว น้ำหนักจึงสูงกว่า ถ้าเขียนสั้นกว่าจะแพ้และโฟกัสไม่ขึ้นเลย */
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]):focus-visible,
textarea:focus-visible, select:focus-visible {
  box-shadow: inset 0 0 0 1px var(--primary), 0 0 0 3px var(--primary-soft); }
input, select, textarea { font-family: inherit; }
/* ⚠ ต้นเหตุที่ช่องกรอกในตารางสองสามคอลัมน์ซ้อนทับกัน
   input (โดยเฉพาะ type=number/date/time) มีความกว้างขั้นต่ำในตัวราว 180px
   และ min-width ของ grid/flex item ดีฟอลต์เป็น auto = "ห้ามเล็กกว่าเนื้อใน"
   ช่องจึงไม่ยอมหดตามรางที่กว้าง 140-150px แต่ล้นออกไปทับช่องข้าง ๆ
   ต้องแก้ที่นี่ที่เดียว ไม่ใช่ไล่ใส่ทีละฟอร์ม เพราะฟอร์มใหม่ทุกอันจะพังแบบเดียวกันหมด
   (หน้า liff.html มีกฎคู่นี้อยู่ก่อนแล้ว ตอนนี้สองหน้าประพฤติตัวเหมือนกัน) */
input, select, textarea { min-width: 0; max-width: 100%; }
label { min-width: 0; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* แถบชิปหมวดหมู่ (คลังสินค้า) — เลื่อนแนวนอนบรรทัดเดียว สกอลล์บาร์บาง */
.cat-chip-row { scrollbar-width: thin; }
.cat-chip-row::-webkit-scrollbar { height: 6px; }

/* ---------- layout ---------- */
/* ระยะขอบซ้าย/ขวาของทั้งหน้า — ปกติ 26px แต่บนจอกว้างจะโตขึ้นเองจนเนื้อหากว้างไม่เกิน --page-w
   เปลี่ยนตัวเลขนี้ที่เดียว ทั้งหัวจอและเนื้อหาขยับตามพร้อมกัน */
:root {
  --page-w: 1480px;
  --page-gut: max(26px, calc((100% - var(--page-w)) / 2));
  --page-gut-sm: max(18px, calc((100% - var(--page-w)) / 2));
}
.app-root { display: flex; height: 100dvh; overflow: hidden; }
.app-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
/* ── ความกว้างเนื้อหาบนจอกว้าง ──
   จอ 24 นิ้วขึ้นไปถ้าปล่อยให้ทุกอย่างยืดเต็มความกว้าง ตารางกับการ์ดจะถูกดึงจนหนึ่งบรรทัด
   ยาวเกินกว่าสายตาจะกวาดจบในทีเดียว ตัวหนังสือลอยอยู่คนละมุมกับตัวเลขที่มันอธิบาย
   หนีบด้วย padding ที่โตตามจอ ไม่ใช่ max-width เพราะ .app-content คือตัวที่เลื่อนได้
   ถ้าหนีบตัวมันเอง แถบเลื่อนจะหลุดเข้ามาลอยอยู่กลางจอแทนที่จะอยู่ขอบขวา
   หัวจอใช้สูตรเดียวกันเป๊ะ ขอบซ้าย/ขวาของทุกแถวจึงอยู่ในแนวเดียวกัน
   100% ในที่นี้คือความกว้างของ .app-main ซึ่งหักแถบเมนูออกไปแล้ว */
.app-content { flex: 1; overflow: auto; padding: 22px var(--page-gut); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
[data-density="compact"] .app-content { padding: 16px var(--page-gut-sm); }

/* ---------- sidebar ---------- */
.sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; transition: width .2s; }
.sidebar[data-mode="icons"] { width: 76px; align-items: center; }
/* ใต้โลโก้ไม่มีเส้นคั่น — หัวข้อกำกับกลุ่มแถวแรกทำหน้าที่แบ่งให้แล้ว
   เส้นสองเส้นซ้อนกันห่างกันไม่กี่พิกเซล กลายเป็นขีดสองเส้นที่ไม่ได้แบ่งอะไรเพิ่ม
   min-height คงไว้ เพราะมันคือตัวที่ทำให้หัวแถบเมนูสูงเท่าหัวจอของหน้า */
.sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 18px 20px; min-height: 73px; }
.sidebar[data-mode="icons"] .sidebar-brand { padding: 18px 0; justify-content: center; }
.brand-mark { height: 38px; width: 38px; flex-shrink: 0; display: block; }
.brand-name { font-family: var(--brand-font); font-size: 19px; font-weight: 700; letter-spacing: -.02em; color: var(--brand-ink); line-height: 1.05; white-space: nowrap; }
.brand-name .plus { color: #22B36A; }

.sidebar-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.sidebar[data-mode="icons"] .sidebar-nav { width: 100%; align-items: center; }
/* เมนู: หน้าที่เปิดอยู่ใช้ "ขีดเขียวด้านซ้าย + พื้นจาง" ชุดเดียวกับสารบัญในหน้า BOQ/ออกแบบ
   (เดิมทาพื้นเขียวทั้งปุ่ม ซึ่งเด่นกว่าเนื้อหาจริงบนหน้าจอ) */
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 13px; border-radius: var(--r-chip); border: none; background: none;
  cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--text-2); width: 100%; text-align: left; position: relative;
  transition: background .15s, color .15s; white-space: nowrap; }
.sidebar[data-mode="icons"] .nav-item { width: 48px; height: 48px; justify-content: center; padding: 0; }
.nav-item:hover { background: var(--surface2); color: var(--text-1); }
.nav-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }
.nav-item.active::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--primary); }
.sidebar[data-mode="icons"] .nav-item.active::before { display: none; }
/* ── เมนูย่อยของแถวที่เปิดอยู่ ──
   หน้าที่เป็น "มุม" ของข้อมูลชุดเดียวกัน (บอร์ด/ตาราง · ปฏิทิน/นัดสำรวจ/ของฉัน)
   กางเฉพาะตอนอยู่ในเมนูนั้น — ไม่ใช่หีบเพลงที่ต้องกดพับ/กางเอง
   แถบเมนูจึงยาวขึ้นแค่ตอนที่อยู่ในหมวดนั้น ส่วนหัวจอไม่มีอะไรเพิ่มเลย */
.nav-subs { display: flex; flex-direction: column; gap: 1px; margin: 3px 0 5px; position: relative; padding-left: 27px; }
/* เส้นรางแนวตั้ง — บอกด้วยสายตาว่าสามแถวนี้เกาะอยู่กับเมนูข้างบน ไม่ใช่เมนูใหม่สามแถว */
.nav-subs::before { content: ""; position: absolute; left: 20px; top: 4px; bottom: 4px; width: 1.5px;
  border-radius: 2px; background: var(--border-strong); }
.nav-sub { display: flex; align-items: center; gap: 9px; padding: 7px 11px; border-radius: 9px; border: none; background: none;
  cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-3); width: 100%; text-align: left;
  position: relative; white-space: nowrap; font-family: inherit; transition: background .15s, color .15s; }
.nav-sub:hover { background: var(--surface2); color: var(--text-1); }
/* มุมที่เปิดอยู่ — ขีดเขียวทับบนเส้นรางพอดี ชุดเดียวกับขีดซ้ายของแถวแม่ แต่เบากว่า */
.nav-sub.active { color: var(--primary-dark); font-weight: 800; background: var(--surface2); }
.nav-sub.active::before { content: ""; position: absolute; left: -7px; top: 50%; width: 1.5px; height: 17px;
  transform: translateY(-50%); border-radius: 2px; background: var(--primary); }
/* ย่อแถบเป็นไอคอน — เมนูย่อยเหลือไอคอนเล็กเรียงใต้ไอคอนแม่ ไม่มีเส้นราง */
.sidebar[data-mode="icons"] .nav-subs { padding-left: 0; align-items: center; margin: 4px 0 6px; }
.sidebar[data-mode="icons"] .nav-subs::before { display: none; }
.sidebar[data-mode="icons"] .nav-sub { width: 34px; height: 34px; justify-content: center; padding: 0; }
.sidebar[data-mode="icons"] .nav-sub.active::before { left: 0; top: auto; bottom: -2px; transform: none;
  width: 14px; height: 2px; left: 50%; margin-left: -7px; }
/* หัวข้อกำกับกลุ่ม (nav-sect) — แทนเส้นคั่นเปล่า เส้นบอกได้ว่า "คนละพวก" คำบอกได้ว่า "พวกไหน"
   ไม่ใช้ uppercase + letter-spacing แบบเมนูฝรั่ง — ไทยไม่มีตัวพิมพ์ใหญ่
   และการถ่างตัวอักษรจะดันสระกับวรรณยุกต์หลุดตำแหน่ง ใช้ขนาด + น้ำหนัก + สีแทน */
.sidebar-nav > .nav-sect { padding: 0 13px; margin: 12px 0 3px; font-size: 10.5px; font-weight: 700;
  color: var(--text-3); line-height: 1.5; user-select: none; }
.sidebar-nav > .nav-sect:first-child { margin-top: 0; }
.sidebar-nav > .nav-sect.nav-sect-foot { margin-top: auto; padding-top: 12px; }
/* แถบย่อเหลือแค่ไอคอน ไม่มีที่ให้คำ — หัวข้อกลายเป็นขีดสั้น ๆ แทน กลุ่มยังอยู่ แต่ไม่มีชื่อ */
.sidebar[data-mode="icons"] .sidebar-nav > .nav-sect { width: 26px; height: 1px; padding: 0; margin: 10px auto 7px;
  background: var(--border); }
.sidebar[data-mode="icons"] .sidebar-nav > .nav-sect > span { display: none; }
/* กลุ่มท้ายยังต้องถูกดันลงล่างสุดในโหมดไอคอนด้วย
   กฎข้างบนใช้ margin แบบย่อ ซึ่งเขียนทับ margin-top:auto ไปทั้งตัว */
.sidebar[data-mode="icons"] .sidebar-nav > .nav-sect.nav-sect-foot { margin-top: auto; }
/* เมนูที่ปักไว้ล่างสุด (nav-foot) — ขีดเส้นคั่นให้เห็นว่าไม่ได้อยู่กลุ่มเดียวกับหัวข้อด้านบน */
.sidebar-nav > .nav-item.nav-foot { margin-top: auto; }
.sidebar-nav > .nav-item.nav-foot::after {
  content: ""; position: absolute; left: 4px; right: 4px; top: -7px; height: 1px; background: var(--border); }
/* ตัวเลขข้างเมนู: พื้นแดงจาง+ตัวอักษรแดง อ่านง่ายแต่ไม่ตะโกนแข่งกับเนื้อหา */
.nav-badge { margin-left: auto; background: rgba(239,68,68,.13); color: #D93025; font-size: 11px; font-weight: 800;
  min-width: 21px; height: 20px; border-radius: var(--r-pill); display: grid; place-items: center; padding: 0 7px;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.nav-badge.warn { background: rgba(245,158,11,.16); color: #B45309; }
/* ฟ้า = แค่บอกจำนวนของวันนี้ ไม่ใช่เรื่องค้าง จะได้ไม่กลืนกับเลขที่ต้องลงมือ */
.nav-badge.info { background: rgba(14,165,233,.14); color: #0369A1; }
/* ย่อแถบเมนูแล้วไม่มีที่ให้ตัวเลข — เหลือจุดมุมขวาบนของปุ่ม */
.sidebar[data-mode="icons"] .nav-item { position: relative; }
.nav-dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: var(--r-pill);
  background: #D93025; box-shadow: 0 0 0 2px var(--surface); }
.nav-dot.warn { background: #D97706; }
.nav-dot.info { background: #0EA5E9; }

.sidebar-foot { padding: 14px 12px; border-top: 1px solid var(--divider); width: 100%; }
.role-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 0 4px 9px; }
.role-switch { display: flex; flex-direction: column; gap: 3px; }
.role-switch.icons { align-items: center; }
.role-btn { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: var(--r-chip); border: none; background: none;
  cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-2); width: 100%; text-align: left; transition: all .15s; white-space: nowrap; }
.role-switch.icons .role-btn { width: 44px; height: 44px; justify-content: center; padding: 0; }
.role-btn:hover { background: var(--surface2); }
.role-btn.active { background: var(--primary); color: #fff; }

/* ---------- header ---------- */
/* ตั้งลำดับชั้นให้แถบหัวเรื่องอยู่เหนือเนื้อหา — กล่องแจ้งเตือน/เมนูที่ห้อยจากปุ่มบนหัวจะได้ไม่ถูกการ์ดในหน้าทะลุขึ้นมาทับ
   (ธีม aurora ใส่ backdrop-filter ที่แถบนี้ ซึ่งสร้างชั้นซ้อนของมันเอง z-index ข้างในเลยออกไปสู้กับเนื้อหาหน้าไม่ได้)
   60 = ต่ำกว่าฉากหลังเมนูข้าง (70) และกล่องซ้อนต่าง ๆ (100 ขึ้นไป) */
/* สูงขั้นต่ำ — หัวจอทุกหน้าต้องสูงเท่ากัน ไม่งั้นแถบจะขยับขึ้นลงเวลาสลับหน้า
   ที่ต่างกันคือบรรทัดรองใต้ชื่อหน้า (.page-sub) หน้าที่ไม่มีจะเตี้ยกว่าเพื่อน 7px
   จึงจองความสูงของแถบไว้เท่ากับหน้าที่มีครบ (มือถือไม่ต้อง — หัวจอสั้นกว่าอยู่แล้ว) */
.app-header { padding: 18px var(--page-gut) 0; min-height: 88.4px; box-sizing: border-box;
  border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
  position: relative; z-index: 60; }
[data-density="compact"] .app-header { padding: 12px var(--page-gut-sm) 0; }
/* แถวบนไม่ห่อบรรทัด — ชื่อหน้า · ตัวกรอง · ปุ่มเครื่องมือ อยู่แถวเดียวกันเสมอ
   พอที่ไม่พอ ให้ "หด" ไม่ใช่ "ตก" (ตัวกรองเลื่อนแนวนอนได้ ช่องค้นหาแคบลงได้ถึง 150px)
   แถวเครื่องมือที่ตกลงไปบรรทัดล่างแล้วชิดซ้ายคือสิ่งที่กฎนี้มีไว้กัน */
.header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: nowrap; }
/* ชื่อหน้าใช้ฟอนต์หัวเรื่อง + บีบระยะตัวอักษร ให้ดูเป็นงานออกแบบ ไม่ใช่ตัวหนาธรรมดา */
.page-title { font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--text-1);
  letter-spacing: -.035em; white-space: nowrap; line-height: 1.1;
  /* ก้อนชื่อหน้าหดได้ (flex: 0 1 auto) แต่ตัวหนังสือ nowrap — พอจอแคบชื่อหน้าจึงล้นออกไปทับแถบตัวกรอง
     ตัดด้วยจุดไข่ดีกว่าทับกัน — ทับกันคืออ่านไม่ออกทั้งสองอัน */
  overflow: hidden; text-overflow: ellipsis; }
.page-sub { font-size: 12.5px; color: var(--text-3); margin-top: 4px; font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-sub strong { color: var(--text-2); font-weight: 700; }
.clear-chip { border: none; background: var(--surface3); color: var(--text-2); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-pill); cursor: pointer; margin-left: 4px; font-family: inherit; }

/* align-self:center — .header-top ตั้ง align-items:flex-start ไว้ (ให้ชื่อหน้ากับบรรทัดรองเกาะขอบบน)
   กลุ่มปุ่มขวาจึงถูกดันไปชิดบนตามไปด้วย ขณะที่แถบตัวกรองมี align-self:center ของตัวเองอยู่แล้ว
   สองฝั่งเลยไม่อยู่ระดับเดียวกัน ซึ่งพอมองออกว่า "ไม่กลาง" */
.header-actions { display: flex; align-items: center; gap: 12px; align-self: center; }
/* ปุ่มไอคอนบนหัวจอ (แผนที่ · กระดิ่ง · สลับสว่างมืด) — ขนาดและขอบชุดเดียวกันทุกปุ่ม
   ก่อนหน้านี้แต่ละปุ่มเขียนสไตล์ซ้ำกันในไฟล์ jsx ปุ่มใหม่จึงเพี้ยนจากของเดิมได้ง่าย */
/* ── ภาษาปุ่มบนหัวจอ: ไม่มีกรอบ ──
   เดิมทุกปุ่มบนหัวจอมีเส้นขอบ 1px หัวจอจึงเป็นกล่องสี่เหลี่ยมเรียงกันหกเจ็ดใบแข่งกับชื่อหน้า
   ตอนนี้ตอนอยู่เฉย ๆ ไม่มีทั้งขอบและพื้น ความเป็นปุ่มมาจากสามอย่างแทน
     (1) พื้นอ่อนโผล่ขึ้นมาทันทีที่เอาเมาส์ชี้   (2) ยุบลงเล็กน้อยตอนกด
     (3) ตอนเปิดใช้งานอยู่ พื้นเป็นสีเต็มใบ ไม่ใช่แค่ขอบเปลี่ยนสี
   ห้ามถอด :hover/:active ออกไม่ว่ากรณีใด — ปุ่มไม่มีกรอบที่ไม่ตอบสนองตอนชี้
   จะกลายเป็นไอคอนตกแต่งที่ไม่มีใครรู้ว่ากดได้ ซึ่งแย่กว่ามีกรอบเสียอีก
   และคนใช้คีย์บอร์ดต้องพึ่ง :focus-visible ล้วน ๆ จึงต้องมีวงแหวนโฟกัสทุกปุ่ม */
.hdr-icon-btn { width: 44px; height: 44px; border-radius: var(--r-tile); border: none;
  background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--text-2); flex-shrink: 0;
  transition: background .16s ease, transform .12s ease; }
.hdr-icon-btn:hover { background: var(--surface3); }
.hdr-icon-btn:active { transform: scale(.92); }
/* ปุ่มเม็ดยาที่เขียนสไตล์ inline ในไฟล์ jsx (ตัวกรองช่าง) — พื้นตอนชี้ต้องใช้ !important เพราะ inline ชนะกฎปกติ
   ยกเว้นตอนตัวกรองทำงานอยู่ ซึ่งมีพื้นสีของช่างคนนั้นอยู่แล้ว ทับไปจะกลายเป็นเทา */
.hdr-pill { transition: background .16s ease, color .16s ease, transform .12s ease; }
/* ปุ่มบนหัวจอกับแถวในเมนู เปลี่ยนสีพื้นอย่างเดียว ไม่มีเงา — หัวจอเป็นแถบแบนที่นั่งอยู่บนสุดของหน้า
   ของที่อยู่บนนั้นลอยขึ้นมาไม่ได้โดยไม่ทำให้ทั้งแถบดูเป็นชั้นซ้อน
   เงาสงวนไว้ให้ของที่อยู่ในเนื้อหน้า (การ์ด · แถวในรายการ) ซึ่งลอยขึ้นจากพื้นหน้าได้จริง
   แถวในเมนูเขียนสไตล์ inline ในไฟล์ jsx จึงต้อง !important */
.tf-row { transition: background .14s ease, color .14s ease; }
.tf-row:hover { background: var(--primary-soft) !important; color: var(--primary-dark) !important; }
[data-theme="aurora"] .tf-row:hover {
  background: color-mix(in srgb, var(--primary) 26%, transparent) !important; color: #fff !important; }
/* ทั้งหมด · งานบ้าน · โครงการ — ชี้แล้วพื้นเขียวจางไล่เข้ามาแทนเทา ให้รู้ว่าเป็นตัวเลือกของระบบ
   ไม่ใช่ตัวหนังสือลอย ๆ · ต้องใช้ !important เพราะปุ่มชุดนี้เขียนสไตล์ inline ไว้ในไฟล์ jsx
   ตัวที่เลือกอยู่ (data-on="1") ไม่ต้องเปลี่ยนสีตอนชี้ มันมีพื้นบอกสถานะของมันเองแล้ว
   โหมดมืดใช้เขียวผสมโปร่ง ไม่ใช่ --primary-soft ซึ่งเป็นเขียวมิ้นต์อ่อน สว่างจ้าเกินบนพื้นดำ */
.seg-flat > button { transition: background .2s ease, color .2s ease, transform .12s ease; }
.seg-flat > button:not([data-on="1"]):hover {
  background: var(--primary-soft) !important; color: var(--primary-dark) !important; }
.seg-flat > button:active { transform: scale(.95); }
[data-theme="aurora"] .seg-flat > button:not([data-on="1"]):hover {
  background: color-mix(in srgb, var(--primary) 26%, transparent) !important; color: #fff !important; }
.hdr-pill:not([data-on="1"]):hover { background: var(--primary-soft) !important; color: var(--primary-dark) !important; }
[data-theme="aurora"] .hdr-pill:not([data-on="1"]):hover {
  background: color-mix(in srgb, var(--primary) 26%, transparent) !important; color: #fff !important; }
.hdr-pill:active { transform: scale(.96); }
.hdr-icon-btn:focus-visible, .hdr-pill:focus-visible, .delay-toggle:focus-visible, .hdr-user:focus-visible {
  outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
/* ปุ่มสลับสว่าง/มืด — ไอคอนสองใบซ้อนกัน สลับกันหมุนเข้า/ออก ให้รู้สึกว่ามีการ "สลับ" จริง ๆ
   ไม่ใช่ภาพเปลี่ยนเฉย ๆ · ตัวปุ่มยุบลงเล็กน้อยตอนกด เพื่อตอบสนองทันทีก่อนสีทั้งหน้าจะไล่ตาม */
.hdr-icon-btn.thm { position: relative; overflow: hidden; transition: background .16s, border-color .16s, transform .12s; }
.hdr-icon-btn.thm:active { transform: scale(.9); }
.hdr-icon-btn.thm .thm-ic { position: absolute; inset: 0; display: grid; place-items: center;
  transition: opacity .26s ease, transform .42s cubic-bezier(.2,.8,.2,1); }
.hdr-icon-btn.thm .thm-sun { opacity: 0; transform: rotate(-80deg) scale(.4); }
.hdr-icon-btn.thm .thm-moon { opacity: 1; transform: rotate(0deg) scale(1); }
.hdr-icon-btn.thm[data-on="1"] .thm-sun { opacity: 1; transform: rotate(0deg) scale(1); }
.hdr-icon-btn.thm[data-on="1"] .thm-moon { opacity: 0; transform: rotate(80deg) scale(.4); }
/* ไล่สีทั้งหน้าเฉพาะช่วงที่สลับธีม — คลาสนี้ถูกถอดออกเองใน app.jsx หลัง 460ms
   ปล่อยไว้ถาวรไม่ได้ เพราะ transition บนทุกอิลิเมนต์จะไปหน่วงทุกอนิเมชันของหน้า */
html.theme-anim, html.theme-anim * { transition: background-color .34s ease, border-color .34s ease,
  color .34s ease, fill .34s ease, stroke .34s ease !important; }
@media (prefers-reduced-motion: reduce) {
  .hdr-icon-btn.thm .thm-ic { transition: none; }
  html.theme-anim, html.theme-anim * { transition: none !important; }
}
/* ชิปผู้ใช้ท้ายหัวจอ — บอกว่ากำลังใช้สิทธิ์ของใคร และเป็นทางเข้า "โปรไฟล์ของฉัน" (ย้ายมาจากก้นแถบเมนู) */
.hdr-user { display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 5px; border-radius: var(--r-pill);
  background: none; border: none; flex-shrink: 0; max-width: 230px;
  font-family: inherit; text-align: left; cursor: pointer; }
.hdr-user:hover { background: var(--surface2); }
.hdr-user:disabled { cursor: default; }
.hdr-user:disabled:hover { background: none; }
.hdr-user-av img { width: 100%; height: 100%; object-fit: cover; }
.hdr-user-av { width: 34px; height: 34px; border-radius: var(--r-pill); flex-shrink: 0; display: grid; place-items: center; overflow: hidden;
  background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; text-transform: uppercase; }
.hdr-user-tx { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.hdr-user-tx b { font-size: 12.5px; font-weight: 700; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-user-tx i { font-style: normal; font-size: 10.5px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ช่องค้นหา — หน้าตาเดียวกันทุกหน้า ทุกที่ที่มันไปโผล่ (หัวจอ · คลังสินค้า · ลิ้นชักงาน)
   ขอบมนเต็มใบ พื้นเข้มกว่าแผ่นที่มันวางอยู่ — ช่องค้นหาคือหลุมที่รอให้พิมพ์ลงไป
   พื้นจึงบอกขอบเขตได้เอง ไม่ต้องขีดเส้นซ้ำ และไม่กลืนไปกับแผ่นขาวที่รองอยู่
   เส้นสีเขียวเก็บไว้เฉพาะตอนเคอร์เซอร์อยู่ในช่อง นั่นคือการบอกโฟกัส ไม่ใช่กรอบประจำที่
   row-reverse ย้ายแว่นขยายไปทางขวาโดยไม่ต้องแก้ JSX ทั้งสี่ที่ และลำดับแท็บยังเข้าช่องพิมพ์เหมือนเดิม */
.search-box { display: flex; flex-direction: row-reverse; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid transparent;
  border-radius: var(--r-pill); padding: 9px 16px; width: 280px; transition: border-color .15s, box-shadow .15s, background .15s; }
.search-box:hover { background: var(--surface3); }
.search-box:focus-within { background: var(--surface2); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.search-box input { border: none; background: none; box-shadow: none; outline: none; font-size: 13.5px; color: var(--text-1); width: 100%; }
.search-box input::placeholder { color: var(--text-3); }
/* ปุ่มสั่งงานมนเต็มใบเหมือนช่องค้นหา — ในแถบเครื่องมือแถวเดียวกัน ถ้าความมนไม่เท่ากัน
   สายตาจะอ่านว่าเป็นของคนละชุด ทั้งที่อยู่ติดกันและระดับเดียวกัน */
.btn-add { display: flex; align-items: center; gap: 7px; background: var(--primary); color: #fff; border: none; padding: 10px 20px;
  border-radius: var(--r-pill); font-size: 13.5px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-btn); transition: transform .12s, filter .12s; white-space: nowrap; }
.btn-add:hover { transform: translateY(-1px); filter: brightness(1.06); }
/* ── ปุ่มกลาง — โค้ดใหม่ใช้คลาสนี้ ค่าเดียวกับ qBtn() ใน sales.jsx (สูง ~38px · --r-tile · 13px/700) ──
   .btn-pri ทึบ (แถวละตัวเดียว) · .btn-soft เขียวจาง · .btn-dngr รอง ตัวอักษรแดง · .btn-sm ชิปเล็ก · ไม่ใส่อะไร = ปุ่มรอง */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;border:none;border-radius:var(--r-tile);
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;background:var(--surface2);color:var(--text-1);
  box-shadow:var(--shadow-sm);transition:background .15s,filter .15s}
.btn:hover{background:var(--surface3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.btn-pri{background:var(--primary);color:#fff;box-shadow:var(--shadow-btn)}
.btn.btn-pri:hover{filter:brightness(1.06)}
.btn.btn-soft{background:var(--primary-soft);color:var(--primary-dark)}
.btn.btn-soft:hover{filter:brightness(.97)}
.btn.btn-dngr{color:var(--tint-red-tx)}
.btn.btn-sm{padding:6px 12px;font-size:12px;border-radius:var(--r-chip)}

.header-filters { display: flex; align-items: center; gap: 12px; padding: 14px 0; flex-wrap: wrap; }
/* ตัวกรองที่อยู่ในเนื้อหา ไม่ใช่ในหัวจอ (เช่น แถวแท็บของคลังสินค้า)
   ทรงเดียวกับ .header-filters แต่ไม่มีระยะห่างด้านบน เพราะ .app-content มีของตัวเองอยู่แล้ว
   ระยะห่างล่างเป็นตัวคั่นระหว่างแถบกับเนื้อหาที่มันกรอง */
.content-filters { display: flex; align-items: center; gap: 12px; padding: 0 0 14px; flex-wrap: wrap; }
/* แถบตัวกรองตอนขึ้นไปอยู่แถวเดียวกับชื่อหน้า — ไม่มีระยะห่างบน/ล่างของแถวตัวเองแล้ว
   flex กินที่ว่างระหว่างชื่อหน้ากับปุ่มเครื่องมือ · พอจอแคบจนไม่พอ .header-top ห่อบรรทัดให้เอง
   จึงกลับไปเป็นแถวของตัวเองโดยไม่ต้องมี media query แยก */
/* ตัวกรองบนแถวบน — หดได้จนถึงศูนย์แล้วเลื่อนแนวนอนเอา (ไม่ห่อบรรทัด ไม่ดันใครตก)
   margin-right:auto ทำให้มันเกาะอยู่ข้างชื่อหน้า ที่ว่างที่เหลือไปกองอยู่ก่อนปุ่มเครื่องมือ */
/* แถบตัวกรองบนแถวชื่อหน้า — หดทีหลังชื่อหน้าเสมอ (flex-shrink .15)
   การหดของ flex เฉลี่ยตามขนาดฐาน ปล่อยไว้ตัวกรองจะโดนหดพร้อมชื่อหน้า
   แล้วปุ่มท้ายแถบ (ช่าง) โดนตัดครึ่งตัวทั้งที่ยังมีที่ว่างให้ชื่อหน้าคายออกได้อีก
   ชื่อหน้าย่อได้ด้วยจุดไข่ปลา ปุ่มตัวกรองย่อไม่ได้ จึงต้องให้ชื่อหน้ายอมก่อน */
.header-filters.in-top { padding: 0; flex: 0 .15 auto; min-width: 0; margin-right: auto; align-self: center;
  flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.header-filters.in-top::-webkit-scrollbar { display: none; }
/* แถวบนตอนนี้ต้องพอสำหรับ ชื่อหน้า + ตัวกรอง + เครื่องมือ พร้อมกัน
   ช่องค้นหาความกว้างตายตัว 280px คือตัวที่ทำให้ไม่พอแล้วทั้งแถวเครื่องมือตกบรรทัด
   ให้มันหดได้ถึง 150px ก่อน แล้วค่อยห่อบรรทัดถ้ายังไม่พอจริง ๆ */
.header-top .header-actions .search-box { flex: 0 1 280px; min-width: 150px; width: auto; }
.delay-toggle { display: flex; align-items: center; gap: 7px; background: transparent; border: none; color: var(--text-2);
  padding: 7px 15px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: background .16s ease, color .16s ease, transform .12s ease; white-space: nowrap; }
/* ตอนชี้ใช้พื้นสีแดงจาง ๆ ไม่ใช่เทา — บอกล่วงหน้าว่าปุ่มนี้เกี่ยวกับงานล่าช้า ก่อนจะกดด้วยซ้ำ */
.delay-toggle:hover { background: color-mix(in srgb, #EF4444 12%, transparent); color: #D93025; }
.delay-toggle:active { transform: scale(.96); }
.delay-toggle.on { background: #EF4444; color: #fff; }
.delay-toggle.on:hover { background: #DC2626; color: #fff; }
.ghost-btn { display: flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--border); color: var(--text-3);
  padding: 7px 14px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
.ghost-btn:hover { background: var(--surface2); color: var(--text-2); }

@media (max-width: 1100px) {
  .search-box { width: 190px; }
}

/* On desktop: always show sidebar regardless of React inline-style transform */
@media (min-width: 861px) {
  .sidebar { transform: none !important; box-shadow: none !important; }
}

/* ---------- hamburger button (hidden on desktop) ---------- */
.hamburger {
  display: none; align-items: center; justify-content: center;
  width: 38px; height: 38px; border: none; background: var(--surface2);
  border-radius: var(--r-tile); cursor: pointer; flex-shrink: 0; color: var(--text-2);
  transition: background .15s;
}
.hamburger:hover { background: var(--surface3); }

/* close button inside sidebar (hidden on desktop) */
.sidebar-close-btn {
  display: none; align-items: center; justify-content: center;
  position: absolute; top: 16px; right: 14px;
  width: 28px; height: 28px; border: none; background: var(--surface2);
  border-radius: var(--r-pill); cursor: pointer; color: var(--text-2); flex-shrink: 0;
  transition: background .15s;
}
.sidebar-close-btn:hover { background: var(--surface3); }
/* ปุ่มปิด (กากบาท) ทุกตัวในระบบ — วงกลมพื้นเขียวอ่อน
   เดิมแต่ละหน้าวาดเอง บางตัวขาวบนการ์ดขาว บางตัวเทาจนกลืนไปกับหัวแผง
   ใช้ !important เพราะปุ่มพวกนี้มี style ในบรรทัดอยู่แล้วทุกตัว ถ้าไม่ทับก็ไม่มีผล
   ⚠ ไม่แตะ display — ปุ่มปิดเมนูข้าง (.sidebar-close-btn) ซ่อน/โชว์ด้วย display ตามขนาดจอ
   ⚠ ปุ่มกากบาทสีแดงที่แปลว่า "ลบ" ไม่ใช้คลาสนี้ ปิดกับลบต้องหน้าตาต่างกัน */
.x-close { border: none !important; border-radius: var(--r-pill) !important;
  background: var(--primary-soft) !important; color: var(--primary) !important;
  box-shadow: var(--shadow-sm) !important; min-width: 28px; min-height: 28px;
  transition: background .16s ease, transform .16s ease; }
.x-close svg { stroke: currentColor; }
.x-close:hover { background: color-mix(in srgb, var(--primary) 20%, var(--surface)) !important; }
.x-close:active { transform: scale(.94); }
/* แท็บแฟ้มบนลิ้นชักลูกค้า — แท็บที่เลือกขาวเท่าหัวใบ ต่อเป็นแผ่นเดียวกับตัวใบ
   แท็บอื่นเป็นแผ่นจาง ๆ ซ้อนอยู่ข้างหลัง ขอบขวาเฉียงลงแบบแฟ้มเอกสาร (::after)
   z-index ตั้งใน style ของแต่ละแท็บ — แท็บซ้ายทับแท็บขวา แท็บที่เลือกทับทุกตัว
   ⚠ แท็บที่เลือกต้องย้อมสีเท่ากับหัวใบ ถ้าต่างกันรอยต่อจะเห็นเป็นเส้น */
.ld-tabs { display: flex; align-items: flex-end; padding-right: 22px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  width: 0; min-width: 100%; margin-bottom: -2px; }
/* ⚠ แถวแท็บต้องอยู่ "ใต้" ตัวใบ (ตัวใบ z-index 11) — ป๊อปอัปเต็มจอที่เปิดจากในใบ (BOQ ฯลฯ) อยู่ในชั้นของตัวใบ
   ถ้ายกแท็บขึ้นเหนือใบ แท็บจะลอยทับป๊อปอัปพวกนั้น · เงาตัวใบจึงหดขอบให้ตกลงล่างอย่างเดียวแทน */
/* margin-bottom -2px = แท็บมุดลงใต้หัวใบ 2px — ขอบบนหัวใบกับก้นแท็บชนกันพอดีเป๊ะแล้วจอบางความละเอียด (ซูม/DPR ไม่ลงตัว) เห็นเป็นรอยต่อจาง ๆ */
/* width:0 + min-width:100% — แถวแท็บไม่ดันความกว้างลิ้นชัก (ช่อง grid ของฉากหลังจะยืดตามแท็บจนล้นจอมือถือ) แต่ยังเต็มความกว้างเสมอ */
.ld-tabs::-webkit-scrollbar { display: none; }
/* --tc = สีแท็บ · --tb = พื้นแท็บ — ทุกแท็บโทนเดียวกัน (สีหลัก) ไม่แยกสีรายแท็บ
   เคยแยกสีรายแท็บ (เขียว ฟ้า ส้ม ม่วง) ต่อให้ล็อกความสว่างเท่ากันแล้วตาก็ยังอ่านว่าเป็นคนละชุด
   แท็บที่ไม่ได้เลือกย้อมเขียวจาง · แท็บที่เลือกขาวเท่าหัวใบ ต่อเป็นแผ่นเดียว + แถบเขียวบนหัวแท็บ
   มุมล่างสองข้างของแท็บที่เลือกโค้งออก (::before/::after เป็น radial-gradient) ให้ไหลลงหัวใบเนียน ๆ
   ⚠ เคยใช้ขอบเฉียง skewX — ปลายเฉียงแยกจากตัวแท็บเป็นร่องสามเหลี่ยมมืด ๆ ห้ามกลับไปใช้ */
.ld-tab { --tc: var(--primary); --tb: color-mix(in oklab, var(--tc) 18%, var(--surface));
  position: relative; flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; height: 38px;
  padding: 0 16px; margin-right: 5px; border: none; border-radius: 14px 14px 0 0; cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: 700; white-space: nowrap;
  background: var(--tb); color: color-mix(in oklab, var(--tc) 72%, #0F2B33);
  transition: background .18s ease, color .18s ease, height .18s ease; }
.ld-tab:not(.on) { margin-bottom: 2px; }  /* แท็บที่ไม่ได้เลือกจบพอดีขอบบนใบ ไม่จมทับหัวใบ 2px เหมือนแท็บที่เลือก */
.ld-tab:hover { --tb: color-mix(in oklab, var(--tc) 27%, var(--surface)); }
.ld-tab.on { --tb: var(--surface); height: 44px; color: color-mix(in oklab, var(--tc) 80%, #0F2B33);
  box-shadow: inset 0 3px 0 var(--tc); }
.ld-tab.on::before, .ld-tab.on::after { content: ""; position: absolute; bottom: 0; width: 12px; height: 12px; pointer-events: none; }
.ld-tab.on::before { left: -12px; background: radial-gradient(circle at 0 0, transparent 11.5px, var(--surface) 12px); }
.ld-tab.on::after { right: -12px; background: radial-gradient(circle at 100% 0, transparent 11.5px, var(--surface) 12px); }
.ld-tab.on:first-child::before { display: none; }
.ld-tab-n { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--tc) 12%, var(--surface)); color: var(--tc); }
.ld-tab.on .ld-tab-n { background: var(--tc); color: #fff; }
.ld-tab-dot { width: 7px; height: 7px; border-radius: var(--r-pill); background: #EF4444; box-shadow: 0 0 0 2px color-mix(in srgb, #EF4444 22%, transparent); }
@media (max-width: 560px) { .ld-tab { padding: 0 11px; margin-right: 4px; font-size: 12.5px; gap: 5px; } }

/* sidebar overlay backdrop */
.sidebar-overlay {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(0,0,0,.42);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  animation: ovFadeIn .2s ease;
}
@keyframes ovFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 860px) {
  /* Sidebar: hidden by default, slides in with .sidebar--open */
  .sidebar {
    position: fixed; z-index: 80; height: 100%;
    transform: translateX(-100%);
    transition: transform .26s cubic-bezier(.4,0,.2,1);
    box-shadow: none;
  }
  .sidebar.sidebar--open {
    transform: translateX(0);
    box-shadow: 6px 0 36px rgba(0,0,0,.22);
  }

  /* Show mobile-only elements */
  .hamburger { display: flex; }
  .sidebar-close-btn { display: flex; }

  /* Sidebar needs relative positioning for close button */
  .sidebar { position: fixed; }
  .sidebar-brand { position: relative; padding-right: 50px; }

  /* Header: compact — เผื่อ safe-area ด้านบน (รอยบาก/แถบสถานะ iOS) */
  .app-header { padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; min-height: 0; }
  [data-density="compact"] .app-header { padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0; }
  .header-top { gap: 8px; flex-wrap: nowrap; align-items: center; }
  .page-title { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .page-sub { display: none; }
  .header-actions { gap: 8px; flex: 1; justify-content: flex-end; }
  .search-box { width: 0; min-width: 0; flex: 1; max-width: 200px; padding: 7px 13px; }
  .btn-add span { display: none; }
  .btn-add { padding: 10px 14px; min-width: 38px; border-radius: var(--r-pill); }
  .header-filters { padding: 8px 0; gap: 6px; }
  .content-filters { padding: 0 0 10px; gap: 6px; }
  .ghost-btn { display: none; }
  .delay-toggle { padding: 5px 9px; font-size: 11.5px; }

  /* จอแคบ: ห้ามเลื่อนทั้งแผ่นตามแนวนอน
     .rows เผื่อขอบไฮไลต์ไว้ข้างละ 10px ด้วย margin ติดลบ พอจอแคบขอบนั้นกลายเป็นความกว้างที่เลื่อนได้จริง
     ผลคือทั้งหน้าแพนซ้ายขวาได้ และการ์ดที่กว้างพอดีอยู่แล้วเลยดูเหมือนขอบไม่ตรงกัน
     ซ่อนแนวนอนได้ เพราะของที่เกินออกไปคือพื้นหลังตอนชี้ ไม่ใช่ข้อมูล — ตารางกว้าง ๆ มีกล่องเลื่อนของตัวเอง */
  .app-content { overflow-x: hidden; }

  /* Content padding — เผื่อ safe-area ด้านล่าง (home indicator / แถบเบราว์เซอร์) */
  .app-content { padding: 12px 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
  [data-density="compact"] .app-content { padding: 10px 10px calc(14px + env(safe-area-inset-bottom, 0px)); }

  /* Force 1-col grids — but NOT the 7-col calendar grid or the KPI grid */
  .app-content [style*="grid-template-columns"]:not([style*="repeat(7"]):not(.kpi-grid) { grid-template-columns: 1fr !important; }
  /* KPI cards: 2 columns on mobile (compact) */
  .app-content .kpi-grid { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
  /* Map: stack vertically */
  .app-content [style*="1.7fr 1fr"] { grid-template-columns: 1fr !important; }
}

/* templated thumbnail for bundler */

/* ============================================================
   ชั้นดีไซน์ใหม่ — แผงตัวเลขหน้าภาพรวม + ลิ้นชักรายละเอียดงาน
   หลักคิด: ลดกล่องซ้อนกล่อง ใช้เส้นผมแบ่งแทนกรอบ · ตัวเลขเป็นพระเอก
   สีใช้เฉพาะตอนมีความหมาย (ล่าช้า = แดง) ไม่ใช่แถบสีประดับทุกใบ
   ============================================================ */

/* ---- แผงตัวเลขรวม: ผืนเดียวแบ่งด้วยเส้นผม ไม่ใช่ 3 กล่องเหมือนกันเป๊ะ ---- */
/* ── โครงหน้าภาพรวม: แถบต้อนรับ · สองคอลัมน์ · ปฏิทินย่อ ── */
.ov-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;
  flex-wrap:wrap;padding:22px 26px;border-radius:var(--r-card);border:1px solid var(--card-bd);
  background:var(--primary-dark) url("dashboard/assets/hero-solarfarm.jpg") right center/cover no-repeat;
  box-shadow:var(--shadow-sm)}
/* ผ้าคลุมสีแบรนด์ทับภาพถ่าย — ทึบทางซ้ายตรงที่เป็นคำทักทายกับวันที่ แล้วจางหายไปทางขวา
   ภาพถ่ายจึงโผล่เต็มตาฝั่งขวา โดยที่ตัวหนังสือขาวฝั่งซ้ายยังอ่านออกเสมอ ไม่ว่าภาพจะสว่างแค่ไหน
   ชั้นบาง ๆ สีดำอีกชั้นกดความสว่างของทั้งใบลงนิดเดียว ให้ตัวเลขสามช่องไม่จมไปกับแสงพระอาทิตย์ในภาพ
   ทั้งชั้นนี้ pointer-events:none ไม่บังปุ่มอะไรทั้งสิ้น
   ภาพลายเส้น hero-solarfarm.svg ยังอยู่ในโฟลเดอร์ สลับกลับไปใช้ได้ถ้าอยากได้แบบวาด */
.ov-hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,var(--primary-dark) 0,var(--primary-dark) 20%,
    color-mix(in srgb,var(--primary-dark) 72%,transparent) 42%,
    color-mix(in srgb,var(--primary) 26%,transparent) 68%,transparent 92%),
    linear-gradient(0deg,rgba(6,28,24,.22),rgba(6,28,24,.22))}
.ov-hero>*{position:relative;z-index:1}
/* ตัวเลขสามช่องวางทับภาพพอดี เบลอพื้นหลังใต้ช่องไว้ไม่ให้เลขจมไปกับแผงโซลาร์ในภาพ */
.ov-hero-fig{backdrop-filter:blur(4px)}
@media(max-width:860px){.ov-hero{background-position:72% center}}
.ov-hero-tx h2{font-family:var(--display);font-size:23px;font-weight:700;color:#fff;letter-spacing:-.03em;line-height:1.2}
.ov-hero-tx p{margin-top:5px;font-size:12.5px;color:rgba(255,255,255,.82)}
.ov-hero-figs{display:flex;gap:10px;flex-wrap:wrap}
.ov-hero-fig{min-width:92px;padding:9px 14px;border-radius:var(--r-tile);background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);text-align:center}
.ov-hero-fig b{display:block;font-family:var(--display);font-size:24px;font-weight:700;color:#fff;
  line-height:1.1;font-variant-numeric:tabular-nums}
.ov-hero-fig span{font-size:11px;color:rgba(255,255,255,.85)}
.ov-hero-fig[data-warn="1"]{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.45)}

.ov-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.ov-main,.ov-rail{display:flex;flex-direction:column;gap:18px;min-width:0}
/* แถวสองแผงคู่กันในคอลัมน์หลัก
   min-width:0 จำเป็น — ช่องของกริดมีความกว้างต่ำสุดเป็น min-content โดยปริยาย
   แผงที่มีชื่องานยาว ๆ จึงดันตัวเองกว้างเกินช่อง แล้วแผงข้าง ๆ ล้นไปทับคอลัมน์ขวา
   และเมื่อคอลัมน์หลักเองแคบกว่า 620px แผงละ 300px ก็แคบเกินอ่าน จึงเรียงลงมาทีละแผง
   ใช้ container query ไม่ใช่ media query เพราะตัวที่กำหนดคือความกว้างของ "คอลัมน์หลัก"
   ซึ่งขึ้นกับทั้งขนาดจอและแถบเมนูซ้ายว่าพับอยู่หรือไม่ — วัดจากความกว้างจอจะเดาผิดครึ่งหนึ่งของเวลา
   (ต้องมี !important เพราะ grid-template-columns มาจาก style ในไฟล์ jsx) */
.ov-main{container-type:inline-size}
.ov-pair>*{min-width:0}
@container (max-width:620px){.ov-pair{grid-template-columns:1fr!important}}
/* ตารางขั้นของใบขออนุญาต — การ์ดเล็กหกใบแทนรายการหกแถว */
.permit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
/* วัดจากความกว้างของคอลัมน์หลักเหมือน .ov-pair ไม่ใช่ความกว้างจอ */
@container (max-width:660px){.permit-grid{grid-template-columns:repeat(2,1fr)}}
@container (max-width:400px){.permit-grid{grid-template-columns:1fr}}
@media(max-width:860px){.permit-grid{grid-template-columns:repeat(2,1fr)}}
/* ไม่มีกรอบ — ของที่กดได้ทุกชิ้นที่อยู่ในแผงเดียวกัน (แถวรายการ · แถวแท่งวัด) ไม่มีเส้นขอบสักชิ้น
   หกใบนี้เคยเป็นชิ้นเดียวที่มี คนจึงอ่านว่าเป็นของคนละชุดกับที่เหลือในแผง
   เก็บ border ไว้เป็น transparent ไม่ได้ถอดทิ้ง — ใบที่ต้องเตือน (data-warn) ยังต้องย้อมขอบแดงได้
   และการ์ดจะได้ไม่ขยับ 2px ตอนขอบโผล่ */
.permit-grid>button{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0;
  padding:13px 14px;border:1px solid transparent;border-radius:var(--r-tile);background:none;
  cursor:pointer;font-family:inherit;text-align:left;transition:background .14s,border-color .14s}
.permit-grid>button:hover{background:var(--surface3)}
.permit-grid .pv{font-family:var(--display);font-size:20px;font-weight:700;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.permit-grid .pl{display:flex;align-items:center;gap:6px;min-width:0;font-size:11.5px;font-weight:600;
  color:var(--text-2);line-height:1.3}
.permit-grid .pl i{width:7px;height:7px;border-radius:var(--r-pill);flex:0 0 auto}
.permit-grid>button[data-warn="1"]{background:color-mix(in srgb,#D93025 8%,var(--surface2));
  border-color:color-mix(in srgb,#D93025 28%,transparent)}

/* แถวที่มีแท่งวัด (ภาระงานต่อช่าง · คอขวดตามขั้น) — ต้องรู้ว่ากำลังชี้แถวไหนอยู่
   แถวพวกนี้กดได้ทั้งแถวเหมือน .rows แต่เขียนสไตล์เองในไฟล์ jsx จึงไม่เคยมีสถานะ hover เลย
   ยกขึ้น 1px พร้อมเงาจาง ๆ ให้รู้สึกว่าแถวลอยขึ้นมารับเมาส์ ไม่ใช่แค่เปลี่ยนสีพื้น */
/* ── เงาตอนเอาเมาส์ชี้: ประกาศไว้ที่เดียว ใช้ทั้งหน้า ──
   สองระดับเท่านั้น — แถวในรายการใช้ระดับเล็ก การ์ดใช้ระดับใหญ่
   ใครจะทำของที่กดได้ชิ้นใหม่ ให้หยิบสองตัวนี้ไปใช้ อย่าคิดเลขเงาเองใหม่ทุกครั้ง
   ไม่งั้นความ "ยกตัวรับเมาส์" ของแต่ละแผงจะหนักเบาไม่เท่ากันภายในไม่กี่เดือน */
/* ตัวแปรย้ายไปอยู่ dashboard/tokens.css แล้ว (หน้า LIFF ใช้ด้วย) */

/* แผงภาระงานต่อช่างมีกรอบเลื่อน (maxHeight+overflowY เขียนไว้ในไฟล์ jsx) — overflow-y:auto
   ทำให้แกนนอนถูกตัดไปด้วยโดยอัตโนมัติ เงาซ้าย/ขวาของแถวจึงโดนเฉือนหายที่ขอบกล่องพอดี
   ดันขอบกล่องออกข้างละ 12px ด้วย padding แล้วดึงกลับเข้ามาด้วย margin ติดลบเท่ากัน
   ตำแหน่งแถวไม่ขยับสักพิกเซล แต่มีที่ว่างให้เงาตกได้ครบทั้งสี่ด้าน */
.bar-rows{padding-left:12px;padding-right:12px;margin-left:-12px;margin-right:-12px}
.bar-rows>button{background:none;border:0;border-radius:var(--r-tile);padding:8px 10px;
  transition:background .16s ease,box-shadow .18s ease,transform .16s ease}
.bar-rows>button:hover{background:var(--surface2);transform:translateY(-2px);box-shadow:var(--hov-sh)}
.bar-rows>button:active{transform:translateY(0);box-shadow:none}
[data-theme="aurora"] .bar-rows>button:hover{background:var(--gr-hi)}

/* การ์ดที่กดได้ก็ยกตัวรับเมาส์เหมือนกัน ให้ภาษาการชี้ทั้งหน้าเป็นชุดเดียว */
.stat-rail>button,.permit-grid>button{transition:background .16s ease,border-color .16s ease,
  box-shadow .18s ease,transform .16s ease}
.stat-rail>button:hover,.permit-grid>button:hover{transform:translateY(-3px);
  box-shadow:var(--hov-sh-lg)}
.stat-rail>button:active,.permit-grid>button:active{transform:translateY(0);box-shadow:none}
/* แถวในรายการยกตัวไม่ได้ (เส้นคั่นระหว่างแถวจะขยับตาม) จึงใช้วงแหวนพื้นสีกว้าง 6px
   เป็นตัวบอกขอบเขตแถว แล้วเติมเงาใต้แถวให้หนาขึ้นเท่ากับที่อื่น */
/* แถวยกตัวไม่ได้ (เส้นคั่นระหว่างแถวจะขยับตาม) จึงใช้วงแหวนพื้นสีกว้าง 8px เป็นตัวบอกขอบเขตแถว
   เงาที่ตามมาเบากว่าของการ์ด — แถวเป็นของชั้นในสุด เงาหนักเท่าการ์ดจะอ่านว่าแถวลอยพ้นการ์ดที่มันอยู่ */
.rows>button{transition:background .14s ease,box-shadow .18s ease}
.rows>button:hover{box-shadow:0 0 0 8px var(--surface2),0 8px 18px -8px rgba(8,20,14,.22)}
[data-theme="aurora"] .rows>button:hover{box-shadow:0 0 0 8px var(--gr-hi),var(--hov-sh)}
/* ยกเว้นแถวในการ์ดวันบนปฏิทิน — การ์ดใบนี้เป็นป๊อปอัปที่ลอยอยู่บนเงาของตัวเองอยู่แล้ว
   ใส่วงแหวนกับเงาให้แถวข้างในอีกชั้นคือเงาซ้อนเงา พื้นเทาอย่างเดียวพอ
   เมื่อไม่มีเงาแล้วก็ไม่ต้องเผื่อที่ให้เงาตกอีก คืน padding 20px ของการ์ดกลับไปตามเดิม
   แถวจะได้ตรงกับหัวข้อวันที่ด้านบน ไม่ใช่ชิดขอบการ์ดอยู่ชิ้นเดียว */
.ov-day-bd.rows{padding-left:20px;padding-right:20px;margin-left:0;margin-right:0}
.ov-day-bd.rows>button:hover,[data-theme="aurora"] .ov-day-bd.rows>button:hover{box-shadow:none}
/* ช่องวันในปฏิทินกับปุ่มเลื่อนเดือน — เล็กเกินกว่าจะยกตัวได้สวย ใช้พื้นเข้มขึ้นกับเงาสั้น ๆ แทน */
.ov-cal-grid button,.ov-cal-nav button{transition:background .16s ease,box-shadow .18s ease,transform .16s ease}
.ov-cal-grid button:hover,.ov-cal-nav button:hover{box-shadow:var(--hov-sh);transform:translateY(-1px)}
.ov-cal-grid button:active,.ov-cal-nav button:active{transform:translateY(0);box-shadow:none}
@media (prefers-reduced-motion: reduce){
  .bar-rows>button,.stat-rail>button,.permit-grid>button,
  .ov-cal-grid button,.ov-cal-nav button{transition:background .16s ease}
  .bar-rows>button:hover,.stat-rail>button:hover,.permit-grid>button:hover,
  .ov-cal-grid button:hover,.ov-cal-nav button:hover{transform:none}
}

@media(max-width:1100px){.ov-layout{grid-template-columns:1fr}}

.ov-cal-nav{display:inline-flex;align-items:center;gap:6px}
.ov-cal-nav b{font-size:12px;font-weight:700;color:var(--text-2);min-width:96px;text-align:center}
.ov-cal-nav button{width:24px;height:24px;border-radius:8px;border:none;box-shadow:var(--shadow-sm);
  background:var(--surface2);cursor:pointer;display:grid;place-items:center;padding:0}
.ov-cal-nav button:hover{background:var(--surface3)}
.ov-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:12px}
.ov-cal-grid .hd{text-align:center;font-size:10.5px;font-weight:700;color:var(--text-3);padding-bottom:4px}
.ov-cal-grid button{position:relative;aspect-ratio:1;border:none;background:none;border-radius:var(--r-chip);
  cursor:pointer;font-family:inherit;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.ov-cal-grid button:hover{background:var(--surface3)}
.ov-cal-grid button[data-today="1"]{font-weight:700;color:var(--primary)}
.ov-cal-grid button[data-on="1"]{background:var(--primary);color:#fff;font-weight:700}
.ov-cal-grid button i{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:var(--r-pill);background:var(--primary)}
.ov-cal-grid button[data-on="1"] i{background:#fff}
/* ท้ายปฏิทิน — แถบเดียวบอกวันที่เลือก กดแล้วเปิดรายการงานของวันนั้นเป็นป๊อปอัป
   รายการเต็มเคยต่อท้ายตรงนี้ ซึ่งยืดปฏิทินยาวตามจำนวนงานของวันนั้นแบบไม่มีเพดาน */
.ov-cal-foot{margin-top:14px;border-top:1px solid var(--divider);padding-top:10px}
.ov-cal-foot .em{font-size:11.5px;color:var(--text-3)}
/* ปุ่มท้ายแผง — สรุปวันที่เลือกบนปฏิทิน และ "ดูงานที่เหลือ" ของแผงที่ตัดรายการไว้สามแถว
   มีแต่ตัวหนังสือกับลูกศร ไม่มีทั้งกรอบและพื้น เพราะมันคือทางออกจากแผง ไม่ใช่ของอีกชิ้นในแผง
   ใส่พื้นเทาเต็มใบเมื่อไร มันจะหนักกว่าทุกแถวที่มันสรุปอยู่ทันที */
.ov-cal-foot button,.pnl-more{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:9px 11px;border-radius:var(--r-chip);border:none;background:none;
  font-family:inherit;font-size:12px;font-weight:650;color:var(--text-1);cursor:pointer;
  transition:background .14s,color .14s}
.ov-cal-foot button:hover,.pnl-more:hover{background:var(--surface2);color:var(--primary-dark)}
/* ปุ่มนี้อยู่นอกกล่องที่เลื่อนได้ของแผงเสมอ ไม่งั้นต้องเลื่อนลงไปหาปุ่มที่บอกว่ามีของให้เลื่อนดู */
.pnl-more{margin-top:10px}

/* ป๊อปอัปรายการงานของวันที่เลือก */
.ov-day-ov{position:fixed;inset:0;z-index:80;padding:24px;display:flex;align-items:center;justify-content:center;
  background:rgba(8,20,14,.5);backdrop-filter:blur(3px);animation:ovFade .16s ease}
.ov-day-card{width:min(520px,100%);max-height:min(640px,86vh);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--card-bd);border-radius:26px;overflow:hidden;
  box-shadow:0 32px 80px -20px rgba(8,20,14,.34);animation:ovPop .2s cubic-bezier(.2,.8,.2,1)}
.ov-day-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:20px 22px 14px}
.ov-day-hd b{display:block;font-family:var(--display);font-size:16px;font-weight:700;color:var(--text-1)}
.ov-day-hd span{display:block;font-size:11.5px;color:var(--text-3);margin-top:3px}
.ov-day-hd button{width:32px;height:32px;flex-shrink:0;border-radius:var(--r-pill);border:none;
  background:var(--surface2);cursor:pointer;display:grid;place-items:center}
.ov-day-hd button:hover{background:var(--surface3)}
.ov-day-bd{padding:4px 20px 18px;overflow-y:auto}
@keyframes ovFade{from{opacity:0}to{opacity:1}}
@keyframes ovPop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* ช่องตัวเลขเป็นการ์ดแยกใบ — ใช้ชุดสีเดียวกับ .pnl เป๊ะ (พื้น surface · ขอบ border · เงา shadow-sm)
   เคยเป็นการ์ดกระจกโปร่ง 55% + backdrop-filter ซึ่งอ่านว่าเป็นของคนละชุดกับแผงที่วางเรียงอยู่ข้าง ๆ
   ทั้งที่เป็นข้อมูลระดับเดียวกัน — พื้นจางลงกว่าเพื่อนหนึ่งขั้นและขอบเข้มกว่าเพื่อนหนึ่งขั้นพร้อมกัน
   ถ้าจะกลับไปทำพื้นโปร่ง ต้องทำพร้อมกันทั้ง .pnl ด้วย ไม่งั้นจะกลับมาไม่เข้าพวกเหมือนเดิม
   ใบนี้ใช้ร่วมกันทั้งภาพรวมช่าง · ภาพรวมหัวหน้า · คลังของ · งานขาย จึงเปลี่ยนพร้อมกันทั้งสี่หน้า */
.stat-rail{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative}
.stat-rail>button{position:relative;display:flex;flex-direction:column;gap:0;align-items:flex-start;
  padding:20px 22px;border:1px solid var(--card-bd);
  border-radius:var(--r-card);overflow:hidden;cursor:pointer;font-family:inherit;text-align:left;
  background:var(--surface);box-shadow:var(--shadow-card);
  transition:background .16s,border-color .16s}
/* ตอนชี้เปลี่ยนแค่พื้น — ขอบโผล่ขึ้นมาเฉพาะตอนชี้ไม่ได้ เพราะการ์ดใบอื่นไม่มีขอบ
   ความ "ยกตัว" มาจากเงาในกฎ :hover ข้างบนอยู่แล้ว */
.stat-rail>button:hover{background:var(--surface2)}
/* คำกำกับ: ไม่ uppercase ไม่ถ่างตัวอักษร ด้วยเหตุผลเดียวกับ .pnl-hd .t */
.stat-rail .lb{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:650;
  color:var(--text-3)}
.stat-rail .lb .pip{width:6px;height:6px;border-radius:var(--r-pill);flex:0 0 auto}
.stat-rail .num{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;
  letter-spacing:-.035em;color:var(--text-1);margin:13px 0 0;font-variant-numeric:tabular-nums}
.stat-rail .num em{font-style:normal;font-family:var(--sans);font-size:13px;font-weight:600;
  color:var(--text-3);letter-spacing:0;margin-left:6px}
.stat-rail .sub{margin-top:7px;font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.stat-rail .sub b{color:var(--text-2);font-weight:650}
.stat-rail>button[data-alert="1"] .num{color:#D93025}
.stat-rail>button[data-alert="1"]{background:linear-gradient(180deg,rgba(217,48,37,.09),transparent 60%),
  var(--surface)}
/* ช่องที่กำลังใช้กรองอยู่ — คาดเส้นเขียวใต้ช่อง บอกว่ากดค้างไว้ */
.stat-rail>button[data-active="1"]{background:var(--surface2)}
.stat-rail>button[data-active="1"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary)}
.stat-rail .go{position:absolute;right:18px;bottom:18px;opacity:0;transform:translateX(-4px);
  transition:opacity .16s,transform .16s;color:var(--primary-dark)}
.stat-rail>button:hover .go{opacity:1;transform:none}
@media(max-width:860px){.stat-rail{grid-template-columns:1fr;gap:10px}
  .stat-rail>button{flex-direction:row;align-items:center;gap:14px;padding:14px 16px}
  .stat-rail .num{margin:0;font-size:28px;min-width:52px}
  .stat-rail .sub{margin-top:2px}}


/* ══════════════════════════════════════════════════════════════
   บอร์ดงาน — ราง (คอลัมน์) กับการ์ด
   สามหน้าที่เป็นบอร์ด (งานติดตั้ง · งานขาย · เอกสารราชการ) เคยก๊อบสไตล์การ์ดไปคนละชุด
   พร้อมตัวจัดการ onMouseEnter/onMouseLeave ที่เขียนเลขเงาไว้ในไฟล์ jsx ทีละที่
   ย้ายมาไว้ที่นี่คลาสเดียว — สามหน้าจึงเปลี่ยนพร้อมกันเสมอ และการชี้กลับไปเป็นงานของ CSS
   ⚠ อย่าใส่ box-shadow/borderRadius ของการ์ดบอร์ดกลับเข้าไปในไฟล์ jsx อีก
   ══════════════════════════════════════════════════════════════ */

/* รางของขั้นงาน — เป็น "ถาดรอง" ไม่ใช่การ์ด จึงสว่างกว่าพื้นหน้าหนึ่งขั้นและไม่มีเงาของตัวเอง
   การ์ดข้างในเป็นสีขาวเต็มพร้อมเงา ความต่างสองชั้นนี้คือสิ่งที่ทำให้กองงานอ่านออกโดยไม่ต้องมีเส้นขอบ */
/* รางเป็น "ร่องที่จมลงไป" ไม่ใช่ "แผ่นที่ลอยขึ้นมา" — จึงต้องเข้มกว่าพื้นหน้าเสมอ
   ⚠ ห้าทำรางให้สว่างกว่าพื้นหน้า (เช่น rgba(255,255,255,.04) ในโหมดมืด)
     รางจะกลายเป็นแผ่นสว่างบนพื้นมืด รางที่ว่างและแคบจึงอ่านออกมาเป็นแถบขาวตั้ง ไม่ใช่ร่องรองการ์ด
   และห้ามถอดสีรางออกทั้งหมด — เคยลองแล้ว ขั้นงานที่ยังไม่มีการ์ดจะหายไปทั้งคอลัมน์ มองไม่เห็นว่ามีขั้นนั้นอยู่
   หัวรางเป็น sticky รับพื้นมาจากรางด้วย inherit — สีตรงนี้จึงต้องทึบ ห้าม transparent */
.bd-col{border-radius:var(--r-card);background:color-mix(in srgb,var(--text-1) 5%,var(--bg));
  border:1px solid transparent;transition:background .15s,border-color .15s,opacity .15s}
/* หัวรางค้างบนสุดเวลาเลื่อน จึงต้องพื้นทึบ — ไม่มีเส้นคาดใต้ ที่ว่างแยกหัวออกจากกองการ์ดพอแล้ว */
.bd-col>.hd{padding:14px 16px 10px;position:sticky;top:0;z-index:1;background:inherit;
  border-radius:var(--r-card) var(--r-card) 0 0}
.bd-col>.bd{padding:0 11px 11px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:80px}
/* ช่องว่างตอนยังไม่มีงาน — เส้นประมนตามการ์ด ไม่ใช่มุมเหลี่ยมกว่าของที่มันรอ */
.bd-col .empty{padding:22px 0;text-align:center;font-size:12px;color:var(--text-3);
  border:1.5px dashed var(--border-strong);border-radius:var(--r-tile)}

/* การ์ดใบงาน/ใบลูกค้า — ขาวเต็ม ไม่มีเส้นขอบ ลอยด้วยเงาฟุ้ง
   ขีดสีซ้ายวาดด้วย ::before ไม่ใช่ border-left เพราะ border หนา 3px จะดันเนื้อหาเข้ามา 3px
   และทำให้มุมมนฝั่งซ้ายกลายเป็นวงโค้งหนาคนละขนาดกับอีกสามมุม
   สีของขีดส่งเข้ามาทาง --rail จากไฟล์ jsx (ไม่ตั้ง = ไม่มีขีด = งานปกติ) */
/* สถานะของใบบอกด้วย "ผ้าคลุมสีจาง" ทั้งใบ ไม่ใช่ขีดเส้นที่ขอบ
   ขีดเส้นบอกได้แค่ว่ามีสีติดอยู่ตรงขอบ · ผ้าคลุมทำให้ทั้งใบเป็นสีของสถานะนั้นไปเลย
   กวาดตาดูทั้งบอร์ดแล้วแยกกองออกได้โดยไม่ต้องอ่านตัวหนังสือ
   ไล่มาจากมุมขวาแล้วจางหายก่อนถึงกลางใบ — ฝั่งซ้ายซึ่งเป็นตัวหนังสือจึงยังขาวสะอาด
   ⚠ ห้ามใส่เส้นขอบสีเข้มรอบใบ (เคยมี inset ring สีเดียวกัน แล้วถอดออก)
     ผ้าคลุมมันจางหายไปกลางใบ แต่เส้นขอบเข้มเท่ากันทั้งรอบ มันจึงกลายเป็นกรอบสีที่ครอบผ้าคลุมไว้
     กลายเป็นการ์ดมีกรอบสี ซึ่งหนักกว่าขีดเส้นเดิมที่ถอดทิ้งไปเสียอีก
   สีส่งเข้ามาทาง --rail จากไฟล์ jsx · ไม่ตั้ง = ผสมกับ transparent = ไม่มีสีเลย (ใบปกติจึงขาวล้วน) */
.bd-card{position:relative;background-color:var(--surface);
  background-image:radial-gradient(150% 170% at 100% 40%,
    color-mix(in srgb,var(--rail,transparent) 15%,transparent) 0%,transparent 62%);
  border:1px solid var(--card-bd);border-radius:var(--r-tile);padding:13px 15px;cursor:grab;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .16s ease,transform .16s ease,opacity .15s ease,background-image .16s ease}
/* ตอนชี้ ผ้าคลุมเข้มขึ้นแทนการขึ้นเส้นขอบ — สีที่มีอยู่แล้วเข้มขึ้น ไม่ใช่ของชิ้นใหม่โผล่มา */
.bd-card:hover{transform:translateY(-2px);box-shadow:var(--hov-sh);
  background-image:radial-gradient(150% 170% at 100% 40%,
    color-mix(in srgb,var(--rail,transparent) 24%,transparent) 0%,transparent 62%)}
.bd-card:active{transform:none;box-shadow:var(--shadow-sm)}
.bd-card[data-drag="1"]{opacity:.4}
/* ใบที่กดดูได้อย่างเดียว (ลากไม่ได้) — เคอร์เซอร์ต้องไม่หลอกว่าลากได้ */
.bd-card[data-nodrag="1"]{cursor:pointer}
@media (prefers-reduced-motion: reduce){.bd-card:hover{transform:none}}
/* พื้นมืดไม่มีเงาให้ใช้ — การ์ดบอกตัวเองด้วยความสว่างกับเส้นขอบบางแทน */
/* โหมดมืดผสมดำลงไป ไม่ใช่ขาวขึ้นมา — ร่องมืดบนพื้นมืดไม่มีขอบสว่างให้เห็นเป็นเส้น */
[data-theme="aurora"] .bd-col{background:color-mix(in srgb,#000 34%,var(--bg))}
/* ⚠ background-color ไม่ใช่ background — แบบย่อจะล้าง background-image ไปด้วย
   ซึ่งคือผ้าคลุมสีสถานะทั้งหมด โหมดมืดจึงเคยไม่มีสีสถานะเลย ทั้งที่กฎกลางเขียนไว้ครบ */
/* พื้นการ์ดในโหมดมืดย้อมสีสถานะไว้เจือออน ๆ แทนที่จะเป็นเทากลางล้วน
   เทาล้วนที่มีผ้าคลุมสีพาดทับ ตาจะเอาสองอย่างมาเทียบกัน เทาจึงอ่านออกมาหม่น และรอยต่อก็หัก
   พอพื้นถือสีเดียวกับผ้าคลุมไว้จาง ๆ ผ้าคลุมก็ไม่มีจุดเริ่มให้สังเกต ทั้งใบจึงเนียนเป็นผืนเดียว
   ที่เขียน var(--rail,#1E1E22) ไม่ใช่ transparent — ใบที่ไม่มีสถานะจะได้
   สีเดิมผสมกับสีเดิมคือสีเดิม ทึบเต็มร้อย ถ้าใช้ transparent การ์ดจะโปร่งแล้วเห็นร่องมืดทะลุขึ้นมา
   ⚠ และไม่มีเส้นขอบขาว — ขาวคือสีที่ทำให้แผ่นสีเข้มดูเป็น "เทาติดขาว"
     ร่องมืดของรางแยกขอบการ์ดให้อยู่แล้ว ไม่ต้องขีดเส้นซ้ำ */
[data-theme="aurora"] .bd-card{background-color:color-mix(in srgb,var(--rail,#1E1E22) 7%,#1E1E22);
  border-color:transparent;box-shadow:0 1px 3px rgba(0,0,0,.5)}
/* พื้นมืด สีจาง 15% จะจมหายไปกับการ์ดเทาเข้ม ต้องเข้มกว่าโหมดสว่างเกือบสองเท่า
   จุดจบขยับมาที่ 70% แทน 62% — ผ้าคลุมที่เข้มขึ้นต้องจางยาวขึ้นด้วย ไม่งั้นขอบที่ตัดจะชัด */
[data-theme="aurora"] .bd-card{background-image:radial-gradient(150% 170% at 100% 40%,
  color-mix(in srgb,var(--rail,transparent) 26%,transparent) 0%,transparent 70%)}
[data-theme="aurora"] .bd-card:hover{background-image:radial-gradient(150% 170% at 100% 40%,
  color-mix(in srgb,var(--rail,transparent) 38%,transparent) 0%,transparent 70%)}

/* แถบความคืบหน้า — ไล่เฉดจากจางไปเข้ม ไม่ใช่แท่งสีตัน
   แท่งสีตันบอกได้อย่างเดียวว่า "มาถึงตรงนี้" · การไล่เฉดบอกทิศทางที่มันวิ่งไปด้วย
   ปลายที่เข้มที่สุดคือหัวแถว ซึ่งเป็นจุดที่ตาไปหยุดพอดี
   สีส่งเข้ามาทาง --fill จากไฟล์ jsx — ประกาศคลาสนี้แทนการเขียน background ซ้ำทุกที่ */
.mbar{border-radius:var(--r-pill);background:var(--surface3);overflow:hidden;display:block}
.mbar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,color-mix(in srgb,var(--fill) 45%,transparent),var(--fill));
  transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* ══ แถวเครื่องมือในลิ้นชัก (ไอคอน · หัวเรื่อง · บรรทัดสถานะ · ลูกศร) ══
   เคยเป็นสไตล์ในบรรทัดชุดเดียวกัน ก๊อบไว้เก้าที่ในสองไฟล์ แก้ทีต้องไล่แก้ทุกที่
   ⚠ พื้นของลิ้นชักเป็น --bg (เทาอ่อน) ไม่ใช่ --surface — แถวจึงต้องขาวเต็มใบพร้อมเงา
     ถ้าใช้ --surface2 มันจะสว่างกว่าพื้นลิ้นชักไม่ถึงห้าหน่วยสี ทั้งแถบอ่านออกมาเป็นสีเทาทึม ๆ */
.act-row{width:100%;margin-bottom:9px;display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--surface);border:none;border-radius:var(--r-tile);cursor:pointer;box-shadow:var(--shadow-sm);
  font-family:inherit;text-align:left;transition:background .16s ease,box-shadow .18s ease,transform .16s ease}
.act-row:hover{transform:translateY(-1px);box-shadow:var(--hov-sh)}
.act-row:active{transform:none;box-shadow:var(--shadow-sm)}
[data-theme="aurora"] .act-row{background:var(--gr-card);box-shadow:0 1px 3px rgba(0,0,0,.4)}
[data-theme="aurora"] .act-row:hover{background:var(--surface2)}
@media (prefers-reduced-motion: reduce){.act-row:hover{transform:none}}
/* ชิปไอคอนหน้าแถว — สี่เหลี่ยมมนจัด ไม่ใช่วงกลม วงกลมจะชนกับจุดสถานะกลม ๆ ที่ใช้ทั่วแอป */
.ic-chip{width:38px;height:38px;border-radius:var(--r-tile);display:grid;place-items:center;flex-shrink:0}

/* ---- แผงเนื้อหาหน้าภาพรวม: หัวข้อคาดเส้นผม + รายการคั่นเส้น แทนกล่องซ้อนกล่อง ---- */
.pnl{background:var(--surface);border:1px solid var(--card-bd);border-radius:var(--r-card);
  padding:22px 24px;box-shadow:var(--shadow-card)}
/* หัวแผงไม่มีเส้นคาดใต้แล้ว — ที่ว่างแยกหัวข้อออกจากเนื้อหาได้อยู่แล้ว
   เส้นคาดในการ์ดที่ตัวการ์ดเองก็ไม่มีขอบ อ่านออกมาเป็นรอยแตกกลางแผ่น ไม่ใช่ตัวแบ่ง */
.pnl-hd{display:flex;align-items:baseline;gap:10px;padding-bottom:15px;margin-bottom:2px}
/* ⚠ ห้ามใส่ uppercase + letter-spacing กลับมา — ภาษาไทยไม่มีตัวพิมพ์ใหญ่ (กฎเลยมีผลกับคำอังกฤษฝั่งเดียว
   หัวข้อสองภาษาในหน้าเดียวกันจึงสูงไม่เท่ากัน) และการถ่างตัวอักษรดันสระกับวรรณยุกต์หลุดตำแหน่ง
   ลำดับความสำคัญบอกด้วยขนาดกับน้ำหนักแทน ซึ่งใช้ได้กับทั้งสองภาษา */
.pnl-hd .t{font-size:13.5px;font-weight:700;color:var(--text-1);letter-spacing:-.01em}
.pnl-hd .s{font-size:11.5px;color:var(--text-3);font-weight:500}
.pnl-hd .r{margin-left:auto}
/* รายการแถว — แตะได้ทั้งแถว คั่นด้วยเส้นผม ไม่ใช่กล่องมีพื้นสีทีละใบ */
/* เผื่อที่ข้างละ 10px ให้วงแหวนกับเงาตอนชี้ — แผงที่ตั้ง maxHeight+overflowY ไว้ในไฟล์ jsx
   (งานค้างไม่ขยับ ฯลฯ) จะตัดทุกอย่างที่เลยขอบกล่อง ไฮไลต์เลยโดนเฉือนตรงเป็นสี่เหลี่ยมทั้งสองข้าง
   padding บวก margin ติดลบเท่ากัน = ขอบกล่องขยายออก แต่ตำแหน่งตัวหนังสือเท่าเดิมเป๊ะ */
.rows{display:flex;flex-direction:column;
  padding-left:10px;padding-right:10px;margin-left:-10px;margin-right:-10px}
.rows>button{display:flex;gap:13px;align-items:center;padding:13px 4px;text-align:left;width:100%;
  background:none;border:0;border-top:1px solid var(--border);cursor:pointer;font-family:inherit;
  transition:background .14s;border-radius:var(--r-tile);position:relative}
.rows>button:first-child{border-top:0}
.rows>button:hover{background:var(--surface2)}
/* เส้นคั่นแถวต้องหายไปตอนชี้ ไม่งั้นมันพาดขวางบล็อกไฮไลต์มุมมนจนอ่านออกมาเป็นสี่เหลี่ยมเหมือนเดิม
   ต้องเก็บสองเส้น: เส้นบนของแถวที่ชี้อยู่เอง กับเส้นบนของแถวถัดไปซึ่งนั่งทับขอบล่างของบล็อกพอดี
   ใช้ border-top-color:transparent ไม่ใช่ border-top:0 — ถ้าลบเส้นทิ้งจริง แถวจะเตี้ยลง 1px
   แล้วทั้งรายการขยับทุกครั้งที่เมาส์ผ่าน */
.rows>button:hover,.rows>button:hover+button{border-top-color:transparent}
.rows .mk{width:9px;height:9px;border-radius:var(--r-pill);flex:0 0 auto;margin-left:3px}
.rows .bd{flex:1;min-width:0}
.rows .nm{display:block;font-size:13.5px;font-weight:650;color:var(--text-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .mt{display:block;font-size:11.5px;color:var(--text-3);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .when{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--text-2);white-space:nowrap;letter-spacing:-.01em}
.rows .when b{display:block;font-family:var(--sans);font-size:10px;font-weight:650;
  color:var(--text-3);letter-spacing:.04em;text-align:right;margin-bottom:1px}
/* .when-1l — คำกำกับกับตัวเลขอยู่บรรทัดเดียวกัน ใช้กับแถวที่คำกำกับสั้นและแถวไม่ควรสูงสองบรรทัด */
.rows .when.when-1l b{display:inline;margin:0 5px 0 0;font-size:10.5px}


/* ══════════════════════════════════════════════════════════════
   ชั้นตกแต่งโหมดกราไฟต์ — ทำงานเมื่อ data-theme="aurora" เท่านั้น
   ทุกกฎในบล็อกนี้เป็นการ "ทับหน้าตา" ล้วน ๆ ไม่มีผลกับข้อมูล
   ผังเต็มขอบจอเหมือนโหมดปกติ ไม่มีกรอบลอย ไม่มีแอนิเมชันพื้นหลัง
   ══════════════════════════════════════════════════════════════ */

/* ── แถบเมนู + หัวหน้า: กระจกฝ้าแบบ iOS ── */
[data-theme="aurora"] .sidebar,
[data-theme="aurora"] .app-header {
  background: var(--gr-bar);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
}
[data-theme="aurora"] .sidebar { border-right: 1px solid var(--border); }
[data-theme="aurora"] .app-header { border-bottom: 1px solid var(--border); }
[data-theme="aurora"] .sidebar-foot { border-color: var(--border); }
[data-theme="aurora"] .brand-name { color: var(--brand-ink); }
/* ชื่อหน้า: เปลี่ยนแค่สี ขนาดกับระยะตัวอักษรคงเดิม สลับโหมดแล้วหัวหน้าจะได้ไม่ขยับ */
[data-theme="aurora"] .page-title { color: var(--text-1); }

/* ── เมนู: หน้าที่เปิดอยู่เป็นแถบสีเขียวทึบ ตัวอักษรขาว ── */
[data-theme="aurora"] .nav-item:hover { background: var(--gr-hi); }
[data-theme="aurora"] .nav-item.active {
  background: var(--primary); color: #fff; box-shadow: none;
}
[data-theme="aurora"] .nav-item.active::before { display: none; }
/* ไอคอนถูกกำหนดสีไว้เป็น attribute ในโค้ด — CSS ชนะ attribute จึงเปลี่ยนเป็นขาวได้ */
[data-theme="aurora"] .nav-item.active svg { stroke: #fff; }
[data-theme="aurora"] .nav-item.active .nav-badge { background: rgba(255,255,255,.9); color: #B3261E; }
[data-theme="aurora"] .nav-badge { background: rgba(255,69,58,.22); color: #FF9F99; }
[data-theme="aurora"] .nav-badge.warn { background: rgba(255,159,10,.20); color: #FFCE7A; }
[data-theme="aurora"] .nav-badge.info { background: rgba(10,132,255,.22); color: #8FD0FF; }
[data-theme="aurora"] .nav-item.active .nav-badge.warn,
[data-theme="aurora"] .nav-item.active .nav-badge.info { background: rgba(255,255,255,.9); color: var(--primary-dark); }
/* จุดบนพื้นมืด — วงขอบต้องเป็นสีพื้นของแถบเมนู ไม่ใช่สีการ์ด */
[data-theme="aurora"] .nav-dot { box-shadow: 0 0 0 2px var(--bg); background: #FF453A; }
[data-theme="aurora"] .nav-dot.warn { background: #FF9F0A; }
[data-theme="aurora"] .nav-dot.info { background: #0A84FF; }
/* เส้นคั่นเหนือเมนูล่างสุด — โหมดกราไฟต์พื้นมืด ใช้เส้นของธีมนี้เอง */
[data-theme="aurora"] .sidebar-nav > .nav-item.nav-foot::after,
[data-theme="aurora"] .sidebar[data-mode="icons"] .sidebar-nav > .nav-sect { background: var(--border-strong); }
[data-theme="aurora"] .role-btn.active { background: var(--primary); color: #fff; }

/* ── การ์ด: เทาสว่างกว่าพื้นหนึ่งระดับ + เส้นขอบบาง ไม่ใช้เงาหนัก ──
   บนพื้นมืด เงาแทบมองไม่เห็น จึงใช้ "ความสว่าง" บอกว่าอะไรลอยอยู่ข้างบน */
[data-theme="aurora"] .pnl,
[data-theme="aurora"] .bq-card,
[data-theme="aurora"] .p3-card {
  background: var(--gr-card); border: 1px solid var(--border);
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
[data-theme="aurora"] .pnl::after { display: none; }
[data-theme="aurora"] .stat-rail > button {
  background: var(--gr-card);
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
[data-theme="aurora"] .stat-rail > button:hover { background: var(--gr-hi); }
[data-theme="aurora"] .stat-rail > button[data-active="1"] { background: var(--gr-hi); }
[data-theme="aurora"] .stat-rail > button[data-active="1"]::after { background: var(--primary-bright); }
[data-theme="aurora"] .stat-rail .num { color: var(--text-1); }
[data-theme="aurora"] .stat-rail > button[data-alert="1"] .num { color: #FF6B62; }
[data-theme="aurora"] .stat-rail > button[data-alert="1"] {
  background: linear-gradient(180deg,rgba(255,69,58,.13),transparent 60%), var(--gr-card);
}
[data-theme="aurora"] .rows > button:hover { background: var(--gr-hi); }

/* ── การ์ดของทุกหน้าที่เหลือ (ตาราง · บอร์ด · ปฏิทิน · รายงาน · คลัง · สำรวจ) ──
   ทั้งระบบเขียนการ์ดด้วยรูปแบบ inline เดียวกันหมด: background var(--surface) + border var(--border)
   จับด้วย attribute selector ทีเดียวจบ ไม่ต้องไล่แก้ 29 จุดใน 15 ไฟล์
   ต้องใช้ !important เพราะของเดิมเป็น inline style ซึ่งชนะกฎ CSS ปกติ */
[data-theme="aurora"] .app-content [style*="background: var(--surface)"][style*="border: 1px solid var(--border)"] {
  box-shadow: 0 1px 3px rgba(0,0,0,.4) !important;
}
/* หัวตารางที่ปักหมุดไว้ (position:sticky) ต้องทึบ ไม่งั้นแถวข้อมูลจะวิ่งทะลุขึ้นมาให้เห็น */
[data-theme="aurora"] .app-content thead th { background: var(--gr-card) !important; }

/* ── ปุ่ม/ช่องกรอก: เปลี่ยนแค่สีพื้นกับเงา ทรงและระยะขอบเท่าโหมดปกติ ── */
[data-theme="aurora"] .btn-add {
  background: var(--primary); color: #fff; box-shadow: none;
}
[data-theme="aurora"] .btn-add:hover { background: var(--primary-bright); box-shadow: none; transform: none; }
[data-theme="aurora"] .search-box:focus-within {
  background: var(--surface2); border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(48,209,88,.16);
}
[data-theme="aurora"] .ghost-btn {
  background: var(--surface2); border-color: transparent; box-shadow: none;
}
/* โหมดมืด: ปุ่มบนหัวจอไม่มีกรอบเหมือนกัน พื้นตอนชี้แค่สว่างขึ้นหนึ่งขั้น */
[data-theme="aurora"] .delay-toggle { background: transparent; border-color: transparent; box-shadow: none; }
[data-theme="aurora"] .delay-toggle:hover { background: rgba(239,68,68,.20); color: #FCA5A5; }
[data-theme="aurora"] .search-box:hover { background: var(--surface2); border-color: var(--border-strong); }
[data-theme="aurora"] .ghost-btn:hover,
[data-theme="aurora"] .hamburger { background: var(--surface2); }
[data-theme="aurora"] .hamburger:hover { background: var(--surface3); }
[data-theme="aurora"] .clear-chip { background: var(--surface3); color: var(--text-2); }

/* ── หน้าจอเต็มจอ BOQ / ออกแบบระบบ ── */
[data-theme="aurora"] .bq-head,
[data-theme="aurora"] .bq-foot,
[data-theme="aurora"] .bq-rail,
[data-theme="aurora"] .su-rail,
[data-theme="aurora"] .su-foot {
  background: var(--gr-bar);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
}
[data-theme="aurora"] .bq-nav[data-on="1"] { background: var(--primary); }
[data-theme="aurora"] .bq-nav[data-on="1"]::before { display: none; }
[data-theme="aurora"] .bq-nav[data-on="1"] .tt { color: #fff; }
[data-theme="aurora"] .bq-nav[data-on="1"] .mt,
[data-theme="aurora"] .bq-nav[data-on="1"] .mt.warn,
[data-theme="aurora"] .bq-nav[data-on="1"] .mt.ok { color: rgba(255,255,255,.8); }
[data-theme="aurora"] .bq-nav[data-on="1"] .ic { background: rgba(255,255,255,.92); color: var(--primary); }
[data-theme="aurora"] .bq-nav[data-on="1"] .ic svg { stroke: var(--primary); }
[data-theme="aurora"] .su-step[data-on="1"] { background: var(--primary); }
[data-theme="aurora"] .su-step[data-on="1"] .tt { color: #fff; }
[data-theme="aurora"] .su-step[data-on="1"] .sb { color: rgba(255,255,255,.8); }
[data-theme="aurora"] .su-step[data-on="1"] .no { background: rgba(255,255,255,.92); color: var(--primary); }

/* ── ลิ้นชักรายละเอียดงาน ── */
[data-theme="aurora"] .drawer-panel { box-shadow: -20px 0 60px rgba(0,0,0,.55); }

/* ── รายละเอียดเล็ก ๆ ที่ทำให้ทั้งระบบดูเป็นชุดเดียวกัน ── */
[data-theme="aurora"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); }
[data-theme="aurora"] ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.28); }
[data-theme="aurora"] ::selection { background: rgba(48,209,88,.3); color: #fff; }
[data-theme="aurora"] .sidebar-overlay { background: rgba(0,0,0,.55); }
/* ── รายงานผลสำรวจหน้างาน ──
   กระดาษรายงานเป็นพื้นขาวเสมอ (ไม่ตามธีมมืด) เพราะมันคือหน้าที่จะพิมพ์ออกมาจริง */
.sv-rep-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 18px; }
.sv-rep-info { display: grid; grid-template-columns: 88px 1fr 88px 1fr; }
.sv-rep-info > :nth-child(4n) { border-right: none; }
.sv-rep-paper { --bg: #fff; --surface: #fff; --surface2: #F7FAFA; --surface3: #EEF3F3;
  --border: #E3E9E8; --border-strong: #CCD9D7; --text-1: #0F2B33; --text-2: #55686C; --text-3: #8FA1A3;
  --primary: #1B9B75; --primary-dark: #0A4D68; --brand-ink: #0F2B33; --brand-muted: #5B8A8A;
  /* กระดาษเป็นพื้นขาวเสมอ ตราสัญลักษณ์จึงต้องกลับมาเป็นชุดสีพื้นสว่าง แม้ตอนนั้นจอเปิดโหมดกราไฟต์อยู่ */
  --fx-1: #0A4D68; --fx-2: #0E6478; --fx-3: #148080;
  --fx-4: #1B9B75; --fx-5: #22B36A; --fx-6: #147A8C; --fx-cut: #FFFFFF; color-scheme: light; }
@media (max-width: 860px) {
  .sv-rep-grid2 { grid-template-columns: 1fr; }
  .sv-rep-info { grid-template-columns: 84px 1fr; }
  .sv-rep-info > :nth-child(2n) { border-right: none; }
}
/* แผ่นแรกของใบบริการสูงเต็มหน้ากระดาษ A4 เสมอ — ช่องเซ็นถูกดันไปติดขอบล่าง
   ใบที่เนื้อหาสั้นจะได้ไม่มีลายเซ็นลอยกลางหน้าแล้วเหลือที่ว่างยาวใต้ลงไป
   262mm = สูงกระดาษ 297 หักขอบบน/ล่างตอนพิมพ์ แล้วเผื่อไว้ไม่ให้ล้นไปหน้าถัดไป */
.om-page { display: flex; flex-direction: column; min-height: 262mm; }
/* !important @#20
H-@G1I margin-top D'IC*D%L-1'@- 6H
0C*D%L
5@*!- */
.om-page > .om-sign { margin-top: auto !important; }
/* บนมือถือไม่มีกระดาษ มีแต่จอ — บังคับสูงเท่า A4 แล้วจะได้ที่ว่างยาวเปล่า ๆ ให้เลื่อนผ่าน */
@media (max-width: 860px) { .om-page { min-height: 0; } }

/* แผ่นแรกของใบเบิกเงินหน้างานสูงเต็มหน้า A4 — ช่องเซ็นถูกดันไปติดขอบล่าง
   ใบที่มีไม่กี่รายการจะได้ไม่มีลายเซ็นลอยกลางหน้าแล้วเหลือที่ว่างยาวใต้ลงไป (กฎเดียวกับ .om-page) */
.ec-page { display: flex; flex-direction: column; min-height: 262mm; }
.ec-page > .ec-foot { margin-top: auto; }
@media (max-width: 860px) { .ec-page { min-height: 0; } }

/* ชุดเอกสารงวดงาน — ช่องเซ็นถูกดันไปติดขอบล่างของหน้า A4 เหมือนใบอื่น
   ใบแจ้งส่งมอบงานของบางงวดมีรายการไม่กี่ข้อ ถ้าไม่ดันลง ลายเซ็นจะลอยกลางหน้า */
.bl-page { display: flex; flex-direction: column; min-height: 262mm; }
.bl-page > .bl-foot { margin-top: auto; }
@media (max-width: 860px) { .bl-page { min-height: 0; } }

/* สมุดส่งมอบ — ช่องลงนามสี่ช่องต้องติดขอบล่างของแผ่นรายการเอกสาร (กฎเดียวกับ .bl-page) */
.pm-page { display: flex; flex-direction: column; min-height: 262mm; }
.pm-page > .pm-foot { margin-top: auto; }
@media (max-width: 860px) { .pm-page { min-height: 0; } }

/* รูปในรายงาน — แนวนอนเต็มความกว้าง · แนวตั้งจำกัดความสูงแล้วจัดกลาง ไม่งั้นกินกระดาษทั้งหน้า */
.sv-rep-shot img { display: block; width: 100%; max-width: 100%; }
.sv-rep-shot[data-p="1"] img { width: auto; max-height: 440px; }

/* พิมพ์ / บันทึกเป็น PDF — ให้เหลือเฉพาะกระดาษรายงาน ไม่มีเมนูหรือปุ่มติดไปด้วย */
@media print {
  /* ธีมมืดตั้ง color-scheme: dark ไว้ที่ :root — พื้นกระดาษของเบราว์เซอร์เลยเป็นสีดำ
     ต้องสั่งกลับเป็น light ตอนพิมพ์ ไม่งั้นได้ขอบดำรอบรายงานติดมาในไฟล์ PDF */
  :root { color-scheme: light !important; }
  html, body, #root, .app-root { background: #fff !important; }
  html, body, #root { height: auto !important; overflow: visible !important; }
  .app-root { display: block !important; height: auto !important; overflow: visible !important; }
  .app-root > *:not(.sv-rep-overlay) { display: none !important; }
  /* กระดาษที่ถูกเปิดซ้อนอยู่ในหน้าต่างอื่น (เช่นใบแจ้งซ่อม) แขวนตัวเองไว้กับ body แทน
     เพราะถ้าอยู่ใน <main> จะโดนบรรทัดบนซ่อนไปด้วย แล้วได้ไฟล์ PDF หน้าขาวเปล่า */
  body.sv-rep-printing > #root { display: none !important; }
  .sv-rep-overlay { position: static !important; inset: auto !important; background: #fff !important;
    padding: 0 !important; overflow: visible !important; z-index: auto !important; }
  .sv-rep-paper { max-width: none !important; margin: 0 !important; padding: 0 !important;
    border-radius: 0 !important; box-shadow: none !important; }
  .sv-rep-noprint { display: none !important; }
  .sv-rep-shot img { max-height: 165mm; }
  /* รูปในรายงานประจำวันวางสองคอลัมน์ — จำกัดความสูงไม่ให้รูปเดียวกินทั้งหน้า */
  .dr-shot img { max-height: 88mm; object-fit: contain; }
  /* รูปใบบริการอยู่ในช่องที่กำหนดสัดส่วนไว้แล้ว ห้ามไปตั้งความสูงทับ ไม่งั้นรูปเบี้ยว */
  .om-sheet, .ec-sheet, .bl-sheet, .pm-sheet { break-before: page !important; page-break-before: always !important; }
  /* แผ่นบิลของใบเบิก — เส้นประกับระยะห่างมีไว้คั่นตอนดูบนจอ พอขึ้นหน้าใหม่จริงไม่ต้องมี */
  .ec-sheet, .bl-sheet { border-top: none !important; margin-top: 0 !important; padding-top: 0 !important; }
  /* รูปประกอบการวางบิลวางสี่รูปต่อหน้า — จำกัดความสูงไม่ให้รูปแนวตั้งใบเดียวดันช่องเซ็นตกหน้า */
  .bl-shot img { max-height: 76mm; object-fit: contain; }
  /* รูปประกอบการส่งมอบวางหน้าละหกรูป — จำกัดความสูงไม่ให้รูปแนวตั้งดันตกหน้า */
  .pm-shot img { max-height: 86mm; object-fit: contain; }
  .sv-rep-shot[data-p="1"] img { max-height: 135mm; }
  /* คงสีป้าย/เส้นคั่นไว้ในไฟล์ PDF ไม่งั้นเบราว์เซอร์ตัดพื้นหลังทิ้งหมด
     บังคับเฉพาะในกระดาษรายงาน ถ้าบังคับทั้งหน้าพื้นมืดของธีมจะติดไปด้วย */
  .sv-rep-paper, .sv-rep-paper * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  @page { size: A4; margin: 12mm 10mm; }
}

   จึงยกช่องกรอกให้สว่างกว่าการ์ดหนึ่งระดับ */
