# ดึงข้อมูลผลิต (KPI) จาก Huawei FusionSolar ทุก 15 นาที — docs/fusionsolar.md
# GitHub เคาะไม่ตรงเวลาและข้ามบ่อย (วันแรกรันแค่ 2 ใน 13 ชม.) — หน้าเว็บจึงขอซิงก์เองด้วยตอนมีคนเปิดดู (job refresh)
# ค่ารายชั่วโมงของกราฟจดเฉพาะรอบแรกของชั่วโมง (fsState/kpi_snap) ถี่ขึ้นแล้วกราฟไม่เพี้ยน
# Vercel Hobby ให้ cron ได้วันละครั้ง จึงให้ GitHub เป็นคนเคาะ /api/cron/fusionsolar?job=kpi แทน
# ต้องตั้ง secret CRON_SECRET ใน GitHub (Settings → Secrets → Actions) ให้ตรงกับ env CRON_SECRET บน Vercel
# ไม่มี secret = ข้ามเงียบ ๆ (ไม่ fail) · ซิงก์จะไม่ทำอะไรจนกว่าแอดมินกด "บันทึกจริงครั้งแรก" ในเว็บ
name: fusionsolar-kpi

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  kpi:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: เรียกซิงก์ข้อมูลผลิต
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "ไม่มี secret CRON_SECRET — ข้าม"; exit 0; fi
          code=$(curl -s -o out.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://flashsolar.vercel.app/api/cron/fusionsolar?job=kpi&src=gh")
          cat out.json; echo
          if [ "$code" -ge 400 ]; then echo "::warning::ซิงก์ตอบ HTTP $code"; exit 1; fi
