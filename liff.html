<!-- ตัวแปรสี/ระยะชุดเดียวกับเว็บเดสก์ท็อป — แก้ที่ไฟล์เดียว ทั้งสองหน้าเปลี่ยนตาม -->
<link rel="stylesheet" href="dashboard/tokens.css?v=14" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--text-1); font-size: 14px;
  -webkit-font-smoothing: antialiased;
  /* ปิดการดีเลย์ 300ms กับการซูมสองนิ้วในแอป LINE — ปุ่มบนมือถือต้องตอบสนองทันที */
  touch-action: manipulation;
}
/* ช่องกรอกบน iOS: ถ้าตัวอักษรเล็กกว่า 16px Safari จะซูมหน้าจอเข้าไปเองตอนโฟกัส แล้วซูมออกไม่กลับ */
input, select, textarea, button { font-family: inherit; font-size: 16px; }
/* ⚠ ต้นเหตุที่หน้าจอเลื่อนซ้ายขวาได้แล้วช่องทับกันบนมือถือ
   input (โดยเฉพาะ type=date/time บน iOS) มีความกว้างขั้นต่ำในตัว และ min-width ของ
   flex/grid item ดีฟอลต์เป็น auto — มันจึงไม่ยอมหดตาม width:100% แต่ไปดันคอลัมน์จนล้นจอ
   ต้องแก้ที่นี่ที่เดียว ไม่ใช่ไล่ใส่ทีละฟอร์ม เพราะฟอร์มใหม่ทุกอันจะพังแบบเดียวกันหมด */
input, select, textarea { min-width: 0; max-width: 100%; }
/* กล่องที่ห่อช่องกรอกก็ต้องยอมหดด้วย ไม่งั้นตัวมันเองล้นรางไปทับรางข้าง ๆ
   (min-width ของ grid/flex item ดีฟอลต์เป็น auto = "ห้ามเล็กกว่าเนื้อใน") */
label { min-width: 0; }
/* ⚠ ช่องวันที่บน iOS ยื่นเลยขอบการ์ดออกไปทางขวา — คนละสาเหตุกับ min-width ข้างบน
   Safari เรนเดอร์ "ค่า" ข้างในช่อง date/time ผ่านชิ้นส่วนเงา ::-webkit-date-and-time-value
   ซึ่งจัดข้อความไว้กลางและกว้างตามเนื้อความของตัวเอง โดยไม่ฟัง width ของช่องที่ครอบมันอยู่
   ตัวช่องจึงถูกดันกว้างเกินรางไปเท่ากับระยะขอบพอดี และข้อความจะอยู่กลางช่อง
   (ซึ่งเป็นจุดสังเกตว่าเป็นอาการนี้ ไม่ใช่เรื่อง box-sizing)

   ⚠ ต้องมี -webkit-appearance: none ด้วย ไม่งั้น iOS ใช้ขนาดของคอนโทรลตัวเอง
     แล้วคำสั่ง width ทั้งหมดถูกเมินทั้งชุด
   Chrome บนคอมไม่มีอาการนี้ ทดสอบบนเครื่องจึงไม่เห็น — ต้องดูบนมือถือจริงเท่านั้น */
input[type="date"], input[type="time"], input[type="datetime-local"], input[type="month"] {
  -webkit-appearance: none; appearance: none; display: block; width: 100%;
}
input[type="date"]::-webkit-date-and-time-value,
input[type="time"]::-webkit-date-and-time-value,
input[type="datetime-local"]::-webkit-date-and-time-value,
input[type="month"]::-webkit-date-and-time-value {
  text-align: left; width: 100%; margin: 0;
}
/* ตาข่ายกันอีกชั้น — หน้านี้ไม่มีอะไรที่ควรกว้างเกินจอ ถ้ามีแปลว่าพัง ไม่ใช่ให้เลื่อนดู */
html, body { overflow-x: hidden; }
a { color: var(--primary-dark); }

/* ══ หน้าตาเดียวกับเว็บ (ผู้ใช้ขอ ต.ค. 2026) ══
   เดิมมีสกินเฉพาะ LIFF ทับตัวแปร (พื้นนวลอมเขียว · การ์ดมีเส้นขอบ · ช่องกรอกพื้นขาว) — ถอดออกแล้ว
   ตอนนี้ใช้ tokens.css ชุดเดียวกับ index.html ทั้งหมด · กฎตาม DESIGN.md: การ์ดไม่มีเส้นขอบ ลอยด้วยเงา
   ช่องกรอก = หลุม (--surface2 + --shadow-inset) · --soft/--soft-lg เป็นชื่อเดิมที่โค้ด LIFF ใช้อยู่ ชี้ไปเงาของเว็บ */
:root { --soft: var(--shadow-sm); --soft-lg: var(--shadow-card); }
input, textarea, select { background: var(--surface2); color: var(--text-1); border: none; }
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),
textarea, select { box-shadow: var(--shadow-inset); }
input:focus, textarea:focus, select:focus { outline: none; }
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]):focus-visible,
textarea:focus-visible, select:focus-visible {
  box-shadow: inset 0 0 0 1px var(--primary), 0 0 0 3px var(--primary-soft); }
/* ปุ่มปิด (กากบาท) — ชุดเดียวกับหน้าเว็บ ดูคำอธิบายที่ index.html */
.x-close { border: none !important; border-radius: 999px !important;
  background: var(--primary-soft) !important; color: var(--primary) !important;
  box-shadow: var(--shadow-sm) !important; min-width: 28px; min-height: 28px; }
.x-close svg { stroke: currentColor; }
</style>
</head>

   ⚠ ค่าลับจริง (channel secret / access token) อยู่ใน Vercel Environment Variables เท่านั้น */
window.LN_LIFF_ID = "2011577974-yzS9mgQQ";
</script>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
