<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PHITHAN GREEN — ระบบติดตามงานติดตั้งโซล่าเซลล์</title>
<link rel="icon" type="image/svg+xml" href="dashboard/assets/favicon.svg" />
<link rel="icon" type="image/png" href="dashboard/assets/phithan-mark.png" />
<link rel="apple-touch-icon" href="dashboard/assets/phithan-mark.png" />
<meta name="theme-color" content="#22A35B" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<style>
:root {
  --sans: 'IBM Plex Sans Thai', sans-serif;
  --display: 'Sora', 'IBM Plex Sans Thai', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --bg: #EEF3EF; --surface: #FFFFFF; --surface2: #F5F9F6; --surface3: #E9F0EB;
  --border: #E3EAE5; --border-strong: #CFDAD3;
  --text-1: #15211A; --text-2: #55645B; --text-3: #93A399;
  --shadow-sm: 0 1px 2px rgba(20,40,28,.04), 0 1px 3px rgba(20,40,28,.05);
  --primary: #22A35B; --primary-dark: #14663A; --primary-soft: #E1F5E8; --primary-bright: #35B76D;
  --sidebar-w: 250px;
}
/* ── โหมดออโรรา (AURORA) ──────────────────────────────────────
   สกินพิเศษ: เปลี่ยนบรรยากาศทั้งระบบเป็นแสงเหนือยามค่ำ
   ทุกอย่างทำผ่านตัวแปรสีชุดเดิม + ชั้นตกแต่งด้านล่าง
   ข้อมูล โครงสร้างหน้า และตรรกะทั้งหมดไม่ถูกแตะเลยแม้แต่บรรทัดเดียว
   ────────────────────────────────────────────────────────────── */
[data-theme="aurora"] {
  --bg: #04090C; --surface: #0B1519; --surface2: #101F24; --surface3: #172C32;
  --border: rgba(125,247,209,.11); --border-strong: rgba(125,247,209,.24);
  --text-1: #EAFBF4; --text-2: #94B5AB; --text-3: #5F8277;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.5), 0 10px 34px rgba(0,0,0,.34);
  --au-a: #3DFFB0; --au-b: #37D8FF; --au-c: #A98CFF;
  color-scheme: dark;
}
[data-cardstyle="flat"] { --shadow-sm: none; }
[data-density="compact"] { --sidebar-w: 230px; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); background: var(--bg); color: var(--text-1); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
#root { height: 100dvh; }
button { font-family: inherit; }
input, select, textarea { font-family: inherit; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* แถบชิปหมวดหมู่ (คลังสินค้า) — เลื่อนแนวนอนบรรทัดเดียว สกอลล์บาร์บาง */
.cat-chip-row { scrollbar-width: thin; }
.cat-chip-row::-webkit-scrollbar { height: 6px; }

/* ---------- layout ---------- */
.app-root { display: flex; height: 100dvh; overflow: hidden; }
.app-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.app-content { flex: 1; overflow: auto; padding: 22px 26px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
[data-density="compact"] .app-content { padding: 16px 18px; }

/* ---------- sidebar ---------- */
.sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; transition: width .2s; }
.sidebar[data-mode="icons"] { width: 76px; align-items: center; }
.sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); min-height: 73px; }
.sidebar[data-mode="icons"] .sidebar-brand { padding: 18px 0; justify-content: center; }
.brand-mark { height: 40px; width: auto; background: #fff; padding: 4px 6px; border-radius: 10px; box-shadow: var(--shadow-sm); flex-shrink: 0; }
.brand-name { font-family: var(--display); font-size: 15px; font-weight: 800; letter-spacing: .01em; color: var(--primary-dark); line-height: 1.1; white-space: nowrap; }
.brand-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

.sidebar-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.sidebar[data-mode="icons"] .sidebar-nav { width: 100%; align-items: center; }
/* เมนู: หน้าที่เปิดอยู่ใช้ "ขีดเขียวด้านซ้าย + พื้นจาง" ชุดเดียวกับสารบัญในหน้า BOQ/ออกแบบ
   (เดิมทาพื้นเขียวทั้งปุ่ม ซึ่งเด่นกว่าเนื้อหาจริงบนหน้าจอ) */
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 13px; border-radius: 11px; border: none; background: none;
  cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--text-2); width: 100%; text-align: left; position: relative;
  transition: background .15s, color .15s; white-space: nowrap; }
.sidebar[data-mode="icons"] .nav-item { width: 48px; height: 48px; justify-content: center; padding: 0; }
.nav-item:hover { background: var(--surface2); color: var(--text-1); }
.nav-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }
.nav-item.active::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--primary); }
.sidebar[data-mode="icons"] .nav-item.active::before { display: none; }
/* ตัวเลขข้างเมนู: พื้นแดงจาง+ตัวอักษรแดง อ่านง่ายแต่ไม่ตะโกนแข่งกับเนื้อหา */
.nav-badge { margin-left: auto; background: rgba(239,68,68,.13); color: #D93025; font-size: 11px; font-weight: 800;
  min-width: 21px; height: 20px; border-radius: 99px; display: grid; place-items: center; padding: 0 7px;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.nav-badge.warn { background: rgba(245,158,11,.16); color: #B45309; }

.sidebar-foot { padding: 14px 12px; border-top: 1px solid var(--border); width: 100%; }
.role-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 0 4px 9px; }
.role-switch { display: flex; flex-direction: column; gap: 3px; }
.role-switch.icons { align-items: center; }
.role-btn { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; border: none; background: none;
  cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-2); width: 100%; text-align: left; transition: all .15s; white-space: nowrap; }
.role-switch.icons .role-btn { width: 44px; height: 44px; justify-content: center; padding: 0; }
.role-btn:hover { background: var(--surface2); }
.role-btn.active { background: var(--primary); color: #fff; }

/* ---------- header ---------- */
.app-header { padding: 18px 26px 0; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
[data-density="compact"] .app-header { padding: 12px 18px 0; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
/* ชื่อหน้าใช้ฟอนต์หัวเรื่อง + บีบระยะตัวอักษร ให้ดูเป็นงานออกแบบ ไม่ใช่ตัวหนาธรรมดา */
.page-title { font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--text-1);
  letter-spacing: -.035em; white-space: nowrap; line-height: 1.1; }
.page-sub { font-size: 12.5px; color: var(--text-3); margin-top: 4px; font-variant-numeric: tabular-nums; }
.page-sub strong { color: var(--text-2); font-weight: 700; }
.clear-chip { border: none; background: var(--surface3); color: var(--text-2); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; cursor: pointer; margin-left: 4px; font-family: inherit; }

.header-actions { display: flex; align-items: center; gap: 12px; }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 9px 13px; width: 280px; transition: border-color .15s, box-shadow .15s, background .15s; }
.search-box:focus-within { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.search-box input { border: none; background: none; outline: none; font-size: 13.5px; color: var(--text-1); width: 100%; }
.search-box input::placeholder { color: var(--text-3); }
.btn-add { display: flex; align-items: center; gap: 7px; background: var(--primary); color: #fff; border: none; padding: 10px 18px;
  border-radius: 11px; font-size: 13.5px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(34,163,91,.25); transition: transform .12s, box-shadow .12s; white-space: nowrap; }
.btn-add:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(34,163,91,.35); }

.header-filters { display: flex; align-items: center; gap: 12px; padding: 14px 0; flex-wrap: wrap; }
.delay-toggle { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-2);
  padding: 7px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
.delay-toggle:hover { border-color: #EF4444; }
.delay-toggle.on { background: #EF4444; border-color: #EF4444; color: #fff; }
.ghost-btn { display: flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--border); color: var(--text-3);
  padding: 7px 13px; border-radius: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
.ghost-btn:hover { background: var(--surface2); color: var(--text-2); }

@media (max-width: 1080px) {
  .search-box { width: 190px; }
}

/* On desktop: always show sidebar regardless of React inline-style transform */
@media (min-width: 861px) {
  .sidebar { transform: none !important; box-shadow: none !important; }
}

/* ---------- hamburger button (hidden on desktop) ---------- */
.hamburger {
  display: none; align-items: center; justify-content: center;
  width: 38px; height: 38px; border: none; background: var(--surface2);
  border-radius: 10px; cursor: pointer; flex-shrink: 0; color: var(--text-2);
  transition: background .15s;
}
.hamburger:hover { background: var(--surface3); }

/* close button inside sidebar (hidden on desktop) */
.sidebar-close-btn {
  display: none; align-items: center; justify-content: center;
  position: absolute; top: 16px; right: 14px;
  width: 28px; height: 28px; border: none; background: var(--surface2);
  border-radius: 8px; cursor: pointer; color: var(--text-2); flex-shrink: 0;
  transition: background .15s;
}
.sidebar-close-btn:hover { background: var(--surface3); }

/* sidebar overlay backdrop */
.sidebar-overlay {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(0,0,0,.42);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  animation: ovFadeIn .2s ease;
}
@keyframes ovFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 860px) {
  /* Sidebar: hidden by default, slides in with .sidebar--open */
  .sidebar {
    position: fixed; z-index: 80; height: 100%;
    transform: translateX(-100%);
    transition: transform .26s cubic-bezier(.4,0,.2,1);
    box-shadow: none;
  }
  .sidebar.sidebar--open {
    transform: translateX(0);
    box-shadow: 6px 0 36px rgba(0,0,0,.22);
  }

  /* Show mobile-only elements */
  .hamburger { display: flex; }
  .sidebar-close-btn { display: flex; }

  /* Sidebar needs relative positioning for close button */
  .sidebar { position: fixed; }
  .sidebar-brand { position: relative; padding-right: 50px; }

  /* Header: compact — เผื่อ safe-area ด้านบน (รอยบาก/แถบสถานะ iOS) */
  .app-header { padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; }
  [data-density="compact"] .app-header { padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0; }
  .header-top { gap: 8px; flex-wrap: nowrap; align-items: center; }
  .page-title { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .page-sub { display: none; }
  .header-actions { gap: 8px; flex: 1; justify-content: flex-end; }
  .search-box { width: 0; min-width: 0; flex: 1; max-width: 200px; padding: 7px 10px; }
  .btn-add span { display: none; }
  .btn-add { padding: 10px 12px; min-width: 38px; border-radius: 10px; }
  .header-filters { padding: 8px 0; gap: 6px; }
  .ghost-btn { display: none; }
  .delay-toggle { padding: 5px 9px; font-size: 11.5px; }

  /* Content padding — เผื่อ safe-area ด้านล่าง (home indicator / แถบเบราว์เซอร์) */
  .app-content { padding: 12px 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
  [data-density="compact"] .app-content { padding: 10px 10px calc(14px + env(safe-area-inset-bottom, 0px)); }

  /* Force 1-col grids — but NOT the 7-col calendar grid or the KPI grid */
  .app-content [style*="grid-template-columns"]:not([style*="repeat(7"]):not(.kpi-grid) { grid-template-columns: 1fr !important; }
  /* KPI cards: 2 columns on mobile (compact) */
  .app-content .kpi-grid { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
  /* Map: stack vertically */
  .app-content [style*="1.7fr 1fr"] { grid-template-columns: 1fr !important; }
}

/* templated thumbnail for bundler */

/* ============================================================
   ชั้นดีไซน์ใหม่ — แผงตัวเลขหน้าภาพรวม + ลิ้นชักรายละเอียดงาน
   หลักคิด: ลดกล่องซ้อนกล่อง ใช้เส้นผมแบ่งแทนกรอบ · ตัวเลขเป็นพระเอก
   สีใช้เฉพาะตอนมีความหมาย (ล่าช้า = แดง) ไม่ใช่แถบสีประดับทุกใบ
   ============================================================ */

/* ---- แผงตัวเลขรวม: ผืนเดียวแบ่งด้วยเส้นผม ไม่ใช่ 3 กล่องเหมือนกันเป๊ะ ---- */
.stat-rail{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);
  border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);position:relative}
.stat-rail::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 140% at 0% 0%,rgba(34,163,91,.055),transparent 58%)}
.stat-rail>button{position:relative;display:flex;flex-direction:column;gap:0;align-items:flex-start;
  padding:20px 22px;border:0;background:none;cursor:pointer;font-family:inherit;text-align:left;
  transition:background .16s}
.stat-rail>button+button{box-shadow:inset 1px 0 0 var(--border)}
.stat-rail>button:hover{background:var(--surface2)}
.stat-rail .lb{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:650;
  letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.stat-rail .lb .pip{width:6px;height:6px;border-radius:99px;flex:0 0 auto}
.stat-rail .num{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;
  letter-spacing:-.035em;color:var(--text-1);margin:13px 0 0;font-variant-numeric:tabular-nums}
.stat-rail .num em{font-style:normal;font-family:var(--sans);font-size:13px;font-weight:600;
  color:var(--text-3);letter-spacing:0;margin-left:6px}
.stat-rail .sub{margin-top:7px;font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.stat-rail .sub b{color:var(--text-2);font-weight:650}
.stat-rail>button[data-alert="1"] .num{color:#D93025}
.stat-rail>button[data-alert="1"]{background:linear-gradient(180deg,rgba(217,48,37,.05),transparent 60%)}
/* ช่องที่กำลังใช้กรองอยู่ — คาดเส้นเขียวใต้ช่อง บอกว่ากดค้างไว้ */
.stat-rail>button[data-active="1"]{background:var(--surface2)}
.stat-rail>button[data-active="1"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary)}
.stat-rail .go{position:absolute;right:18px;bottom:18px;opacity:0;transform:translateX(-4px);
  transition:opacity .16s,transform .16s;color:var(--primary-dark)}
.stat-rail>button:hover .go{opacity:1;transform:none}
@media(max-width:860px){.stat-rail{grid-template-columns:1fr}
  .stat-rail>button+button{box-shadow:inset 0 1px 0 var(--border)}
  .stat-rail>button{flex-direction:row;align-items:center;gap:14px;padding:14px 16px}
  .stat-rail .num{margin:0;font-size:28px;min-width:52px}
  .stat-rail .sub{margin-top:2px}}


/* ---- แผงเนื้อหาหน้าภาพรวม: หัวข้อคาดเส้นผม + รายการคั่นเส้น แทนกล่องซ้อนกล่อง ---- */
.pnl{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:20px 22px;box-shadow:var(--shadow-sm)}
.pnl-hd{display:flex;align-items:baseline;gap:10px;padding-bottom:12px;
  border-bottom:1px solid var(--border);margin-bottom:4px}
.pnl-hd .t{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)}
.pnl-hd .s{font-size:11.5px;color:var(--text-3);font-weight:500}
.pnl-hd .r{margin-left:auto}
/* รายการแถว — แตะได้ทั้งแถว คั่นด้วยเส้นผม ไม่ใช่กล่องมีพื้นสีทีละใบ */
.rows{display:flex;flex-direction:column}
.rows>button{display:flex;gap:13px;align-items:center;padding:13px 4px;text-align:left;width:100%;
  background:none;border:0;border-top:1px solid var(--border);cursor:pointer;font-family:inherit;
  transition:background .14s;border-radius:0;position:relative}
.rows>button:first-child{border-top:0}
.rows>button:hover{background:var(--surface2);box-shadow:0 0 0 6px var(--surface2)}
.rows .mk{width:9px;height:9px;border-radius:99px;flex:0 0 auto;margin-left:3px}
.rows .bd{flex:1;min-width:0}
.rows .nm{display:block;font-size:13.5px;font-weight:650;color:var(--text-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .mt{display:block;font-size:11.5px;color:var(--text-3);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .when{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--text-2);white-space:nowrap;letter-spacing:-.01em}
.rows .when b{display:block;font-family:var(--sans);font-size:10px;font-weight:650;
  color:var(--text-3);letter-spacing:.04em;text-align:right;margin-bottom:1px}

/* ══════════════════════════════════════════════════════════════
   ชั้นตกแต่งโหมดออโรรา — ทำงานเมื่อ data-theme="aurora" เท่านั้น
   ทุกกฎในบล็อกนี้เป็นการ "ทับหน้าตา" ล้วน ๆ ไม่มีผลกับข้อมูล
   ══════════════════════════════════════════════════════════════ */

/* ── ท้องฟ้า: ม่านแสงเหนือเคลื่อนช้า ๆ อยู่หลังทุกอย่าง ── */
html[data-theme="aurora"] body::before {
  content: ""; position: fixed; inset: -25% -15%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(42% 46% at 16% 18%, rgba(61,255,176,.42), transparent 64%),
    radial-gradient(38% 44% at 86% 12%, rgba(55,216,255,.36), transparent 66%),
    radial-gradient(48% 52% at 66% 92%, rgba(169,140,255,.34), transparent 68%),
    radial-gradient(34% 38% at 4% 80%, rgba(61,255,176,.22), transparent 70%),
    radial-gradient(60% 60% at 50% 50%, rgba(20,80,70,.28), transparent 72%);
  filter: blur(34px) saturate(150%);
  animation: auDrift 30s ease-in-out infinite alternate;
}
/* ── ฝุ่นดาว: จุดจาง ๆ ให้พื้นหลังไม่เรียบจนดูแบน ── */
html[data-theme="aurora"] body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
  background-image:
    radial-gradient(1px 1px at 12% 28%, rgba(255,255,255,.45), transparent),
    radial-gradient(1px 1px at 76% 18%, rgba(180,255,230,.4), transparent),
    radial-gradient(1px 1px at 42% 72%, rgba(255,255,255,.32), transparent),
    radial-gradient(1px 1px at 88% 64%, rgba(190,220,255,.36), transparent),
    radial-gradient(1px 1px at 28% 88%, rgba(255,255,255,.28), transparent);
  background-size: 340px 340px, 420px 420px, 300px 300px, 480px 480px, 380px 380px;
  animation: auTwinkle 7s ease-in-out infinite alternate;
}
@keyframes auDrift {
  0%   { transform: translate3d(0,0,0) scale(1); }
  50%  { transform: translate3d(-3%,2.5%,0) scale(1.09); }
  100% { transform: translate3d(3.5%,-2%,0) scale(1.04); }
}
@keyframes auTwinkle { from { opacity: .28; } to { opacity: .6; } }
@keyframes auText { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
@keyframes auSweep { from { transform: translateX(-60%); } to { transform: translateX(160%); } }

/* ── กระจกฝ้า: แถบเมนู + หัวหน้า ── */
[data-theme="aurora"] .sidebar,
[data-theme="aurora"] .app-header {
  background: linear-gradient(180deg, rgba(17,34,39,.80), rgba(7,17,20,.88));
  -webkit-backdrop-filter: blur(22px) saturate(155%); backdrop-filter: blur(22px) saturate(155%);
}
[data-theme="aurora"] .sidebar { border-right: 1px solid var(--border); }
[data-theme="aurora"] .app-header { position: relative; border-bottom: 1px solid var(--border); }
/* เส้นแสงวิ่งใต้หัวหน้า — จังหวะช้าพอที่จะไม่รบกวนตอนทำงาน */
[data-theme="aurora"] .app-header::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; overflow: hidden;
  background: linear-gradient(90deg, transparent, rgba(61,255,176,.5) 24%, rgba(55,216,255,.45) 52%, rgba(169,140,255,.42) 76%, transparent);
}
[data-theme="aurora"] .sidebar-brand { border-bottom: 1px solid var(--border); }
[data-theme="aurora"] .brand-mark {
  background: linear-gradient(160deg, #ffffff, #DFFFF2);
  box-shadow: 0 0 0 1px rgba(61,255,176,.3), 0 6px 22px rgba(61,255,176,.28);
}
[data-theme="aurora"] .brand-name,
[data-theme="aurora"] .page-title {
  background: linear-gradient(92deg, #F2FFF9 0%, var(--au-a) 34%, var(--au-b) 62%, var(--au-c) 100%);
  background-size: 240% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: auText 11s ease-in-out infinite alternate;
}
[data-theme="aurora"] .page-title { filter: drop-shadow(0 0 20px rgba(61,255,176,.22)); }

/* ── เมนู: หน้าที่เปิดอยู่เรืองแสง ── */
[data-theme="aurora"] .nav-item:hover { background: rgba(125,247,209,.075); }
[data-theme="aurora"] .nav-item.active {
  background: linear-gradient(90deg, rgba(61,255,176,.19), rgba(55,216,255,.08) 58%, transparent);
  box-shadow: inset 0 0 0 1px rgba(61,255,176,.16);
}
[data-theme="aurora"] .nav-item.active::before {
  width: 3px; background: linear-gradient(180deg, var(--au-a), var(--au-b));
  box-shadow: 0 0 12px rgba(61,255,176,.85);
}
[data-theme="aurora"] .nav-badge { background: rgba(255,107,107,.18); color: #FFB3B3; }
[data-theme="aurora"] .nav-badge.warn { background: rgba(255,209,102,.18); color: #FFDF9B; }
[data-theme="aurora"] .sidebar-foot { border-top: 1px solid var(--border); }
[data-theme="aurora"] .role-btn.active {
  background: linear-gradient(100deg, var(--au-a), var(--au-b)); color: #04231A;
  box-shadow: 0 4px 18px rgba(61,255,176,.3);
}

/* ── แผงเนื้อหา: กระจกลอย ขอบบนเป็นเส้นแสง ── */
[data-theme="aurora"] .pnl,
[data-theme="aurora"] .stat-rail {
  background: linear-gradient(158deg, rgba(255,255,255,.062), rgba(255,255,255,.016));
  -webkit-backdrop-filter: blur(18px) saturate(145%); backdrop-filter: blur(18px) saturate(145%);
  border: 1px solid var(--border); border-radius: 20px; position: relative; overflow: hidden;
  box-shadow: 0 20px 54px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
}
[data-theme="aurora"] .stat-rail::before {
  background: radial-gradient(120% 150% at 0% 0%, rgba(61,255,176,.10), transparent 60%);
}
[data-theme="aurora"] .pnl::after,
[data-theme="aurora"] .stat-rail::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(61,255,176,.6) 22%, rgba(55,216,255,.55) 54%, rgba(169,140,255,.5) 78%, transparent);
}
/* ตัวเลขใหญ่ = พระเอก จึงไล่สีให้เรืองขึ้นมาจากพื้น */
[data-theme="aurora"] .stat-rail .num {
  background: linear-gradient(180deg, #FFFFFF, #96FFD6);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 0 16px rgba(61,255,176,.3));
}
/* ใช้ background-image ไม่ใช่ background ย่อ เพราะตัวย่อจะรีเซ็ต background-clip:text ทิ้ง */
[data-theme="aurora"] .stat-rail>button[data-alert="1"] .num {
  background-image: linear-gradient(180deg, #FFE3E0, #FF7A72);
  filter: drop-shadow(0 0 16px rgba(255,107,107,.35));
}
[data-theme="aurora"] .stat-rail>button[data-alert="1"] { background: linear-gradient(180deg, rgba(255,107,107,.1), transparent 62%); }
[data-theme="aurora"] .stat-rail>button:hover { background: rgba(125,247,209,.06); }
[data-theme="aurora"] .stat-rail>button[data-active="1"] { background: rgba(61,255,176,.09); }
[data-theme="aurora"] .stat-rail>button[data-active="1"]::after {
  background: linear-gradient(90deg, var(--au-a), var(--au-b)); box-shadow: 0 0 14px rgba(61,255,176,.7);
}
[data-theme="aurora"] .rows>button:hover { background: rgba(125,247,209,.06); box-shadow: 0 0 0 6px rgba(125,247,209,.06); }

/* ── ปุ่ม/ช่องกรอก ── */
[data-theme="aurora"] .btn-add {
  background: linear-gradient(100deg, var(--au-a), var(--au-b)); color: #04231A;
  box-shadow: 0 4px 22px rgba(61,255,176,.34), inset 0 1px 0 rgba(255,255,255,.45);
  position: relative; overflow: hidden;
}
[data-theme="aurora"] .btn-add::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 34%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
  animation: auSweep 3.6s ease-in-out infinite;
}
[data-theme="aurora"] .btn-add:hover { box-shadow: 0 8px 32px rgba(61,255,176,.5); }
[data-theme="aurora"] .search-box:focus-within { box-shadow: 0 0 0 3px rgba(61,255,176,.16), 0 0 22px rgba(61,255,176,.2); }
[data-theme="aurora"] .ghost-btn:hover,
[data-theme="aurora"] .hamburger:hover { background: rgba(125,247,209,.09); }
[data-theme="aurora"] .clear-chip { background: rgba(125,247,209,.12); }

/* ── การ์ดในหน้าย่อย (BOQ / ออกแบบ / ผังหน้างาน) ให้เป็นกระจกชุดเดียวกัน ── */
[data-theme="aurora"] .bq-card,
[data-theme="aurora"] .p3-card {
  background: linear-gradient(158deg, rgba(255,255,255,.055), rgba(255,255,255,.014));
  -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
  border-color: var(--border);
  box-shadow: 0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
}

/* ── รายละเอียดเล็ก ๆ ที่ทำให้ทั้งระบบดูเป็นชุดเดียวกัน ── */
[data-theme="aurora"] ::-webkit-scrollbar-thumb { background: rgba(61,255,176,.28); }
[data-theme="aurora"] ::-webkit-scrollbar-thumb:hover { background: rgba(61,255,176,.5); }
[data-theme="aurora"] ::selection { background: rgba(61,255,176,.3); color: #FFFFFF; }
[data-theme="aurora"] .sidebar-overlay { background: rgba(2,10,8,.6); }

/* เครื่องที่ตั้งค่า "ลดการเคลื่อนไหว" ไว้ — คงหน้าตาไว้ แต่หยุดทุกแอนิเมชัน */
@media (prefers-reduced-motion: reduce) {
  html[data-theme="aurora"] body::before,
  html[data-theme="aurora"] body::after,
  [data-theme="aurora"] .brand-name,
  [data-theme="aurora"] .page-title,
  [data-theme="aurora"] .btn-add::after { animation: none; }
}
